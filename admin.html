/* ── مشهد اليوم ─────────────────────────────────────────────────────
   الوقت يُشتقّ من ساعة الجهاز، وتُعاد المحاولة كل ربع ساعة فتنتقل اللوحة
   من الظهيرة إلى المغرب وهي مفتوحة أمامها بلا أن تُحدّث الصفحة. */
function dayBand(d = new Date()) {
  const h = d.getHours();
  return h >= 5 && h < 11 ? 'dawn' : h >= 11 && h < 16 ? 'noon'
       : h >= 16 && h < 19 ? 'dusk' : 'night';
}
function paintScene() {
  const t = dayBand();
  if (document.documentElement.getAttribute('data-time') === t) return;
  document.documentElement.setAttribute('data-time', t);
  document.querySelectorAll('.scene .layer').forEach((l) => l.classList.remove('on'));
  document.getElementById('sc-' + t)?.classList.add('on');
  const meta = document.querySelector('meta[name=theme-color]');
  if (meta) meta.setAttribute('content',
    getComputedStyle(document.documentElement).getPropertyValue('--sky-a').trim() || '#faf5f0');
}
paintScene();
setInterval(paintScene, 900000);

/* الساعة في الشريط: تقول أيّ ضوءٍ نحن فيه بلا أن تُشرح. تُحدَّث كل دقيقة
   فلا تتخلّف عن المشهد حين تنتقل اللوحة من الظهيرة إلى المغرب. */
function tickClock() {
  const el = document.getElementById('clock');
  if (!el) return;
  el.textContent = new Date().toLocaleTimeString('ar-SA-u-nu-arab',
    { hour: 'numeric', minute: '2-digit' });
}
tickClock();
setInterval(tickClock, 60000);

/* ── فراشة ───────────────────────────────────────────────────────────
   طلبها صاحب العمل، وهي أليقُ بمشهدٍ فيه طيرٌ وشجرةٌ تتمايل ويراعاتُ ليل.
   تحطّ على الحافّة العليا لبطاقةٍ حقيقيّة — تُقرأ مواضعُها من الصفحة لا
   من قائمةٍ مكتوبة، فتصحّ مهما تغيّر التخطيط. وتُقلع متى مرّرت الصفحة:
   إزعاجُها جزءٌ من كونها حيّة.

   ولا تفعل شيئًا سوى ذلك: لا تلتقط لمسًا، ولا تُنطَق لقارئ الشاشة، ولا
   تعمل متى طُلب تقليل الحركة أو غابت النافذة أو فُتحت ورقة. */
/* رسمة الفراشة — مصدرٌ واحد يخدم الزرّ في الركن والشعار في التحيّة،
   فلا تفترق الرسمتان إذا عُدّلت إحداهما. */

  return `
    <svg viewBox="0 0 48 42" fill="none" aria-hidden="true">
      <defs>
        <linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0"   stop-color="var(--accent)"/>
          <stop offset=".55" stop-color="var(--accent)"/>
          <stop offset="1"   stop-color="var(--gold)"/>
        </linearGradient>
      </defs>
      <g class="w wl">
        <path d="M24 19C24 10.5 19.4 2.6 12.6 2.6 5.4 2.6 2.6 10.6 6.2 15.8 9 19.8 17 22.4 24 21Z" fill="url(#${gid})"/>
        <path class="lo" d="M24 21.5C18.5 22.5 12.5 25.5 11.8 30.5 11.1 35.5 16 38 19.5 34.5 22 32 23.6 27.5 24 21.5Z" fill="url(#${gid})"/>
        <path class="vn" d="M8.4 6.6C11.8 8.6 15.4 11.6 18 15.4"/>
        <path class="vn" d="M14.6 28.6C16.4 29.8 18.2 31.6 19.2 33.4"/>
      </g>
      <g class="w wr">
        <path d="M24 19C24 10.5 28.6 2.6 35.4 2.6 42.6 2.6 45.4 10.6 41.8 15.8 39 19.8 31 22.4 24 21Z" fill="url(#${gid})"/>
        <path class="lo" d="M24 21.5c5.5 1 11.5 4 12.2 9 .7 5-4.2 7.5-7.7 4-2.5-2.5-4.1-7-4.5-13Z" fill="url(#${gid})"/>
        <path class="vn" d="M39.6 6.6C36.2 8.6 32.6 11.6 30 15.4"/>
        <path class="vn" d="M33.4 28.6C31.6 29.8 29.8 31.6 28.8 33.4"/>
      </g>
      <path class="bd" d="M24 11.4c1.5 0 2 2.6 1.8 7.6-.2 6-.9 11.4-1.8 13-.9-1.6-1.6-7-1.8-13-.2-5 .3-7.6 1.8-7.6Z"/>
      <circle class="bd" cx="24" cy="10.2" r="2.1"/>
      <path class="an" d="M23.3 9C21.4 6 19 4.2 16.4 3.4M24.7 9c1.9-3 4.3-4.8 6.9-5.6"/>
      <circle class="bd" cx="16.1" cy="3.2" r="1.15"/>
      <circle class="bd" cx="31.9" cy="3.2" r="1.15"/>
    </svg>`;
}

/* ── الفراشة ─────────────────────────────────────────────────────────
   كانت تطير وتحطّ حيثما اتّفق. جميلٌ أوّل مرّة، ومُربِكٌ حين صارت زرًّا:
   زرٌّ يتنقّل لا يُحفظ مكانه في اليد. الآن تثبت في ركنٍ واحد، تتنفّس
   بجناحيها، وتفتح ورقة الإضافة — بدل النزول إلى آخر صفحة الحجوزات. */
function startButterfly() {
  if (document.getElementById('addFab')) return;

  const el = document.createElement('button');
  el.className = 'bfly';
  el.id = 'addFab';
  el.type = 'button';
  el.setAttribute('aria-label', 'إضافة حجز');
  el.title = 'إضافة حجز';
  el.innerHTML = butterflySVG('bflyG');

  document.body.appendChild(el);

  el.onclick = () => {
    el.classList.remove('flutter');
    void el.offsetWidth;              // إعادة تشغيل الحركة
    el.classList.add('flutter');
    setTimeout(() => el.classList.remove('flutter'), 1300);
    openBookingKind();
  };
}

const SOURCE_FILTERS = [

/* ── تصفية الحجوزات ─────────────────────────────────────────────────────
   التصفية تجري على ما هو محمَّل في الذاكرة لا بطلب جديد: النافذة المحمَّلة
   ١٢٠ يومًا للخلف وما بعدها، والنتيجة فورية بلا انتظار شبكة. */
function periodBounds() {
  const t = today();
  if (S.fPeriod === 'week')  return [t, addDays(t, 7)];
  if (S.fPeriod === 'month') return [t.slice(0, 8) + '01', addDays(t.slice(0, 8) + '01', 31)];
  if (S.fPeriod === 'range') return [S.fFrom || null, S.fTo || null];
  return [null, null];
}
function matchesQuery(b, q) {
  if (!q) return true;
  const digits = q.replace(/[^0-9٠-٩۰-۹]/g, '');
  if (digits.length >= 3) {
    const norm = normalisePhone(digits) || digits;
    return String(b.client_phone || '').includes(norm.replace(/^966/, ''))
        || String(b.client_phone || '').includes(norm)
        || String(b.ref || '').includes(digits);
  }
  const needle = q.trim().toLowerCase();
  return String(b.client_name || '').toLowerCase().includes(needle)
      || String(b.ref || '').toLowerCase().includes(needle);
}
function filtered() {
  const f = STATUS_FILTERS.find((x) => x.id === S.fStatus) || STATUS_FILTERS[0];
  const src = SOURCE_FILTERS.find((x) => x.id === S.fSource) || SOURCE_FILTERS[0];
  const [from, to] = periodBounds();
  return S.bookings
    .filter((b) => f.test(b))
    .filter((b) => src.test(b))
    .filter((b) => (!from || b.the_date >= from) && (!to || b.the_date <= to))
    .filter((b) => matchesQuery(b, S.q))
    .sort((a, b) => (b.the_date + b.start_time).localeCompare(a.the_date + a.start_time));
}

const pendingCount = () => S.bookings.filter((b) => b.status === 'pending').length;

async function start() {
  document.getElementById('gate').classList.add('hide');
  document.getElementById('app').classList.remove('hide');
  renderTabs();
  await reload();

  // A request that lands while the dashboard is open should announce itself.
  S.unsubscribe = admin.onBookingChange(async (payload) => {
    await reload();
    if (payload.eventType === 'INSERT' && payload.new?.status === 'pending') {
      toast(`طلب حجز جديد من ${payload.new.client_name}`, 'ok');
      notify(payload.new);
    }
  });

  if ('Notification' in window && Notification.permission === 'default') {
    setTimeout(() => Notification.requestPermission().catch(() => {}), 4000);
  }
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
}

function notify(b) {
  if (!('Notification' in window) || Notification.permission !== 'granted') return;
  try {
    new Notification('طلب حجز جديد', {
      body: `${b.client_name} — ${fmtDate(b.the_date, { short: true })} ${fmtTime(b.start_time)}`,
      icon: 'assets/icon-192.svg', tag: `bk-${b.id}`,
    });
  } catch { /* notifications unavailable in this context */ }
}

async function reload(announce = false) {
  try {
    const [settings, services, bookings, rules, overrides, templates] = await Promise.all([
      admin.settings(), admin.services(),
      admin.bookings({ from: addDays(today(), -120) }),
      admin.rules(), admin.overrides(addDays(today(), -30), addDays(today(), 180)),
      // القوالب لا تعطّل اللوحة لو سقطت: زرّ «تواصل» يفتح واتساب بلا رسالة.
      admin.templates().catch(() => []),
    ]);
    Object.assign(S, { settings, services, bookings, rules, overrides, templates });
    if (settings?.business_name) document.getElementById('bizName').textContent = settings.business_name;
    renderTabs();
    render();
    if (!reload._bfly) { reload._bfly = true; startButterfly(); }
    if (announce) toast('تم التحديث', 'ok');

    // الرفع يسبق الحجز، فمن تركت الصفحة بعد الرفع تخلّف ملفًا بلا حجز.
    // يُنظَّف مرة واحدة عند فتح اللوحة، بصمت: التنظيف ليس مهمة صاحبته.
    if (!reload._purged) {
      reload._purged = true;
      purgeOrphanReceipts().catch(() => { /* ليس سببًا لتعطيل اللوحة */ });
    }
  } catch (err) {
    console.error(err);
    view.innerHTML = `<div class="note danger mt">${icon('close', 18)}
      <span>تعذّر تحميل البيانات: ${esc(err.message || '')}</span></div>`;
  }
}

/* ── Booking card ─────────────────────────────────────────────────────── */

/* من أين جاء الحجز؟ سؤالٌ يُسأل كل يوم: الحجز الآتي من الرابط دفعت
   صاحبته عربونًا ومرّ بفحص الأوقات، واليدويّ أدخلته إيمان بنفسها. كانت
   الإجابة غيابَ شارة — والغياب لا يُرى، فلا يُفرَّق بين «يدويّ» و«لم
   أنتبه». صارت شارةً حاضرة في الحالين بأيقونتها. */
const SOURCES = {
  client: { icon: 'link', label: 'من الرابط' },
  admin:  { icon: 'edit', label: 'يدوي' },
};
/* علامةٌ صغيرة بجانب الاسم لا شارةٌ في صفّ الشارات: المصدر صفةٌ للحجز
   نفسه كصاحبته، لا حالةٌ تتغيّر كالتأكيد والإلغاء. وشكل الأيقونة هو
   الفارق — سلسلةٌ أو قلم — فلا يُحمَّل اللون وحده معنًى، والصفّ نفسه
   في فلتر «الحجوزات» يعلّم أيّهما أيّ. */
function sourceMark(b) {
  const kind = b.source === 'client' ? 'client' : 'admin';
  const s = SOURCES[kind];
  return `<i class="srcmark ${kind}" title="${esc(s.label)}" aria-label="${esc(s.label)}"`
       + ` role="img">${icon(s.icon, 14)}</i>`;
}

/* بطاقة الحجز كما في النموذج: زرّ الإنجاز أوّل ما تصله الإبهام، والاسم
   والوقت في الوسط، والمبلغ في الطرف الآخر يُقرأ بلمحة. الخدمات شاراتٌ
   تحته، والأفعال الثلاثة أسفلها. الحالة التي لا يصحّ إنجازها لا تعرض زرًّا
   يوهم بأنّها تُنجَز، بل قرصًا ساكنًا يحمل أيقونة الخدمة. */
const CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" '
  + 'stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'
  + '<path d="M4 12.5 L9.5 18 L20 6.5"/></svg>';

function bookingCard(b, { showDate = true } = {}) {
  const items = b.booking_items || [];
  const due = Number(b.price) - Number(b.deposit);
  const lead = items[0] || {};
  const dim = ['cancelled', 'rejected', 'no_show'].includes(b.status);
  const done = b.status === 'done';
  const live = b.status === 'confirmed';

  /* ثلاثة أجزاء لا أربعة: سطرٌ يلتفّ يفقد لمحةَ النظرة الواحدة. المدّة
     تُذكر حين لا يُذكر التاريخ — وهي حالة قائمة اليوم، وأكثرها استعمالًا. */
  const meta = [
    showDate ? fmtDateRelative(b.the_date) : '',
    fmtTime(b.start_time),
    showDate ? '' : fmtDuration(b.duration_min),
    (b.loc_text || '').split('،')[0].trim(),
  ].filter(Boolean).join(' · ');

  const tick = live || done
    ? `<button class="tick" data-tick="${b.id}"
               aria-label="${done ? 'موعد مكتمل' : 'وضع الموعد مكتملًا'}">${CHECK}</button>`
    : `<span class="tick still" data-icon="${esc(lead.service_icon || 'sparkle')}"
             data-icon-size="20" aria-hidden="true"></span>`;

  return `
    <div class="bk s-${esc(b.status)} ${dim ? 'dim' : ''} ${done ? 'done' : ''}" data-card="${b.id}">
      <div class="bk-top">
        ${tick}
        <button class="bk-main" data-open="${b.id}">
          <span class="who">
            <b><span class="nm">${esc(b.client_name)}</span>${sourceMark(b)}</b>
            <span class="meta">${esc(meta)}</span>
          </span>
          <span class="money">
            <span class="t">${money(b.price)}</span>
            <span class="r ${due > 0 ? '' : 'paid'}">${due > 0 ? `متبقّي ${money(due)}` : 'مسدّد'}</span>
          </span>
        </button>
      </div>
      <div class="chips">
        ${serviceBadges(items)}
        <span class="pill ${esc(b.status)}">${esc(statusLabel(b.status))}</span>
        ${b.cancel_requested && ['pending', 'confirmed'].includes(b.status)
          ? '<span class="pill cancelled">طلبت الإلغاء</span>' : ''}
      </div>
      ${quickActs(b)}
      <div class="ask" data-ask="${b.id}" hidden></div>
    </div>`;
}

/* الخدمات تُجمَع بأيقونتها لا تُعدّ عددًا واحدًا: «عروس ×١ · سهرة ×٣» تقول
   ما لا يقوله «٤ أشخاص» — وهو أوّل ما تريد إيمان معرفته عن موعدٍ قادم. */
function serviceBadges(items) {
  const by = new Map();
  (items || []).forEach((i) => {
    const key = i.service_name || 'خدمة';
    const cur = by.get(key) || { icon: i.service_icon || 'sparkle', n: 0 };
    cur.n += 1; by.set(key, cur);
  });
  return [...by.entries()].map(([name, v]) =>
    `<span class="svcb">${icon(v.icon, 14)}<span>${esc(name)}</span>` +
    `${v.n > 1 ? `<b>×${int(v.n)}</b>` : ''}</span>`).join('');
}

/* اتصالٌ ومراسلةٌ وموقع من البطاقة مباشرة. والموقع الناقص لا يختفي بل
   يظهر بإطارٍ مقطّع: غيابه معلومةٌ ينبغي أن تُرى قبل الخروج للموعد. */
function quickActs(b) {
  const wa = waHref(b.client_phone, '');
  return `
    <div class="qacts">
      <a class="qact" href="${telHref(b.client_phone)}">${icon('phone', 15)}اتصال</a>
      <button class="qact" data-msg="${b.id}">${icon('whatsapp', 15)}تواصل</button>
      ${b.loc_map
        ? `<a class="qact" href="${esc(b.loc_map)}" target="_blank" rel="noopener">${icon('pin', 15)}الموقع</a>`
        : `<span class="qact empty">${icon('pin', 15)}بلا موقع</span>`}
    </div>`;
}

function bindCards(root = view) {
  root.querySelectorAll('[data-open]').forEach((el) =>
    el.onclick = () => openBooking(el.dataset.open));
  root.querySelectorAll('[data-msg]').forEach((el) => el.onclick = (e) => {
    e.stopPropagation();
    const b = (S.bookings || []).find((x) => x.id === el.dataset.msg);
    // من داخل ورقة التفاصيل تُفتح القائمة ومعها طريق عودة، فلا تضيع الورقة.
    if (b) openMsgMenu(b, !!el.closest('#sheetContent'));
  });
  root.querySelectorAll('[data-tick]').forEach((el) => el.onclick = (e) => {
    e.stopPropagation();
    const b = (S.bookings || []).find((x) => x.id === el.dataset.tick);
    if (b) askFinish(b, el.closest('.bk'));
  });
}

/* سؤال العربون داخل البطاقة لا في نافذة النظام: الاسم والمبلغ يبقيان أمام
   العين وهي تجيب، والإجابة لا تُغادر السياق. والمسدَّد سلفًا يُنجَز بلا
   سؤال — سؤالٌ بلا سببٍ يُعلّم على تجاهله. */
async function askFinish(b, card) {
  if (b.status === 'done') { toast('الموعد مكتمل أصلًا'); return; }
  const rest = Number(b.price) - Number(b.deposit);
  const box = card?.querySelector('[data-ask]');

  const finish = async (collect) => {
    try {
      if (collect) await admin.update(b.id, { deposit: Number(b.price) });
      await admin.setStatus(b.id, 'done');
      toast(collect ? 'اكتمل الموعد ومُسدّد بالكامل' : 'اكتمل الموعد', 'ok');
      reload();
    } catch (err) {
      console.error(err);
      toast(isOffline(err) ? NET_MSG : 'تعذّر الحفظ', 'danger');
    }
  };

  if (rest <= 0 || !box) { await finish(false); return; }

  if (!box.hidden) { box.hidden = true; box.innerHTML = ''; return; }
  box.innerHTML = `
    <p>باقٍ على <b>${esc(b.client_name)}</b> مبلغ <b>${riyal(rest)}</b>. هل استلمتِه؟</p>
    <div class="btn-row">
      <button class="btn btn-ok" data-yes>نعم، استلمت</button>
      <button class="btn" data-no>تمّ بدون استلام</button>
    </div>`;
  box.hidden = false;
  box.querySelector('[data-yes]').onclick = () => finish(true);
  box.querySelector('[data-no]').onclick  = () => finish(false);
}

/* ── Home ─────────────────────────────────────────────────────────────── */

/* بطاقة التحيّة: تفتح اللوحة بجملةٍ تقول حالة اليوم لا بجدول. التحيّة
   تتبع الساعة نفسها التي يتبعها المشهد، فتبدو الشاشة كلّها شيئًا واحدًا. */
const GREET = {
  dawn:  { k: 'صباحك ورد',   h: 'صباح الخير' },
  noon:  { k: 'نهارك سعيد',  h: 'نهارك مبارك' },
  dusk:  { k: 'مساء الورد',  h: 'مساء الخير' },
  night: { k: 'ليلةٌ هادئة', h: 'مساء الخير' },
};

/* ── بيتُ الغزل ──────────────────────────────────────────────────────
   يفتتح اللوحة بيتٌ من غزل العرب بدل تحيّةٍ عامّة. الشعراء كلّهم أقدمُ
   من قرون، فلا حقوق على أبياتهم؛ وتجنّبتُ المحدثين عمدًا.

   والاختيار كلّه من الوجه المُشرِق للغزل: وصفُ الحُسن، وفرحُ القُرب،
   والودُّ الذي يدوم. لا فِراق ولا عِتاب ولا شكوى — فما يُفتَتَح به
   يومُها ينبغي أن يرفعه لا أن يُثقِله.

   ويُختار مرّةً عند فتح اللوحة لا عند كل رسمٍ للشاشة، فلا يتبدّل البيت

const BAYT = (() => {
  const band = dayBand();
  // ما وُسم بوقتٍ يُقدَّم في وقته، ثمّ يعود إلى الجميع.
  const fit = GHAZAL.filter((b) => b.t === band);
  const pool = fit.length && Math.random() < 0.5 ? fit : GHAZAL;
  let last = -1;
  try { last = Number(localStorage.getItem('eam.bayt')); } catch { /* تصفّح خاص */ }
  let n = Math.floor(Math.random() * pool.length);
  if (pool.length > 1 && GHAZAL.indexOf(pool[n]) === last) n = (n + 1) % pool.length;
  const pick = pool[n];
  try { localStorage.setItem('eam.bayt', String(GHAZAL.indexOf(pick))); } catch { /* لا يضرّ */ }
  return pick;
})();

/* الحافظة تُرفض على اتصالٍ غير آمن وفي متصفّحاتٍ قديمة، فيبقى الطريق
   القديم بديلًا صامتًا بدل أن يفشل الزرّ بلا خبر. */
async function copyText(text) {
  try {
    if (navigator.clipboard?.writeText) { await navigator.clipboard.writeText(text); return true; }
  } catch { /* نُكمل بالبديل */ }
  try {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.setAttribute('readonly', '');
    ta.style.cssText = 'position:fixed;top:-1000px;opacity:0';
    document.body.appendChild(ta);
    ta.select(); ta.setSelectionRange(0, text.length);
    const ok = document.execCommand('copy');
    ta.remove();
    return ok;
  } catch { return false; }
}

function incomeReport(month) {
  const inMonth = S.bookings.filter((b) => b.the_date.startsWith(month));
  const doneL = inMonth.filter((b) => b.status === 'done');
  const openL = inMonth.filter((b) => ['pending', 'confirmed'].includes(b.status));
  const lostL = inMonth.filter((b) => ['cancelled', 'rejected', 'no_show'].includes(b.status));

  const sum = (a) => a.reduce((n, b) => n + Number(b.price), 0);
  const doneV = sum(doneL), openV = sum(openL), lostV = sum(lostL);
  const total = doneV + openV + lostV;

  const STATES = [
    { k: 'done', label: 'مكتمل',  v: doneV, n: doneL.length, c: 'var(--c-done)' },
    { k: 'open', label: 'قادم',   v: openV, n: openL.length, c: 'var(--c-open)' },
    { k: 'lost', label: 'ملغى',   v: lostV, n: lostL.length, c: 'var(--c-lost)' },
  ];

  /* إيراد كل خدمة يُجمع من العناصر لا من الحجز، فالحجز الجماعي يوزَّع صحيحًا. */
  const per = new Map();
  [...doneL, ...openL].forEach((b) => (b.booking_items || []).forEach((i) => {
    const k = i.service_name || 'أخرى';
    const cur = per.get(k) || { n: 0, v: 0 };
    per.set(k, { n: cur.n + 1, v: cur.v + Number(i.price || 0) });
  }));
  const svcRows = [...per.entries()].sort((a, b) => b[1].v - a[1].v);
  const svcTop = Math.max(...svcRows.map(([, v]) => v.v), 1);

  // الشهر الخالي لا يحتاج تقريرًا: القاعدة نفسها التي تُخفي بطاقات اليوم.
  if (!inMonth.length) return '';

  const view = incomeView();

  /* ── أ · أرقامٌ مجرّدة ─────────────────────────────────────────────
     ثلاثة أرقامٍ عناوين لا تحتاج رسمًا: الرقم نفسه هو البيان. */
  const tiles = () => `
    <div class="stats3">
      ${STATES.map((x) => `
        <div class="stat">
          <span class="k"><i class="dt" style="background:${x.c}"></i>${esc(x.label)}</span>
          <span class="v">${money(x.v)}</span>
          <span class="s">${x.n ? `${int(x.n)} حجز` : '—'}</span>
        </div>`).join('')}
    </div>`;

  /* ── ب · الحلقة ──────────────────────────────────────────────────
     نسبةٌ من كلّ، ثلاثة أجزاء لا أكثر — وهو الحدّ الذي تبقى الحلقة عنده
     مقروءة. الإجمالي في وسطها، والأجزاء معنونةٌ تحتها بقيمها. */
  const ring = () => {
    const R = 52, C = 2 * Math.PI * R;
    let acc = 0;
    const arcs = STATES.filter((x) => x.v > 0).map((x) => {
      const len = C * (x.v / (total || 1));
      const dash = Math.max(len - 3, 1.5);          // فاصلٌ من لون السطح بين الأجزاء
      const el = `<circle cx="70" cy="70" r="${R}" fill="none" stroke="${x.c}"
        stroke-width="13" stroke-dasharray="${dash.toFixed(2)} ${(C - dash).toFixed(2)}"
        stroke-dashoffset="${(-acc).toFixed(2)}" transform="rotate(-90 70 70)"/>`;
      acc += len;
      return el;
    }).join('');
    return `
      <div class="ringwrap">
        <svg viewBox="0 0 140 140" class="ring" role="img"
             aria-label="توزيع دخل الشهر: ${STATES.map((x) => `${x.label} ${money(x.v)}`).join('، ')}">
          <circle cx="70" cy="70" r="${R}" fill="none" stroke="var(--glass-2)" stroke-width="13"/>
          ${arcs}
        </svg>
        <div class="ringmid"><b>${money(total)}</b><span>ر.س هذا الشهر</span></div>
      </div>
      <div class="legend">
        ${STATES.map((x) => `
          <div class="lg">
            <i style="background:${x.c}"></i>
            <span class="n">${esc(x.label)}</span>
            <b>${money(x.v)}</b>
            <span class="c">${x.n ? `${int(x.n)} حجز` : '—'}</span>
          </div>`).join('')}
      </div>`;
  };

  /* ── ج · شهرٌ في شبكة ────────────────────────────────────────────
     السؤال الذي لا يجيبه أيّ شريط: أيّ الأيام تكسب؟ لونٌ واحد يتدرّج،
     فالقراءة من الفاتح إلى الغامق لا من لونٍ إلى لون. */
  const grid = () => {
    const [y, mo] = month.split('-').map(Number);
    const days = new Date(y, mo, 0).getDate();
    const lead = new Date(y, mo - 1, 1).getDay();
    const byDay = {};
    [...doneL, ...openL].forEach((b) => {
      byDay[b.the_date] = (byDay[b.the_date] || 0) + Number(b.price || 0);
    });
    const top = Math.max(...Object.values(byDay), 1);
    const cells = [];
    for (let i = 0; i < lead; i += 1) cells.push('<span class="hc blank"></span>');
    for (let d = 1; d <= days; d += 1) {
      const iso = `${month}-${String(d).padStart(2, '0')}`;
      const v = byDay[iso] || 0;
      const a = v ? 0.22 + 0.78 * (v / top) : 0;
      cells.push(`<span class="hc${v ? '' : ' zero'}"
        style="${v ? `--a:${a.toFixed(2)}` : ''}"
        title="${esc(fmtDate(iso))}${v ? ` — ${money(v)} ر.س` : ''}">${int(d)}</span>`);
    }
    return `
      <div class="heat">
        ${WEEKDAYS.map((w) => `<span class="hd">${esc(w.short)}</span>`).join('')}
        ${cells.join('')}
      </div>
      <div class="heatfoot">
        <span>${money(doneV + openV)} ر.س على ${int(doneL.length + openL.length)} يوم حجز</span>
        <span class="scale"><i style="--a:.22"></i><i style="--a:.45"></i><i style="--a:.7"></i><i style="--a:1"></i>الأعلى</span>
      </div>`;
  };

  const body = view === 'ring' ? ring() : view === 'grid' ? grid() : tiles();

  return `
    <div class="sec-head"><h2>دخل هذا الشهر</h2><span class="rule"></span>
      <span class="count">${int(inMonth.length)} حجز</span></div>
    <div class="viewseg" role="group" aria-label="صيغة عرض الدخل">
      ${INCOME_VIEWS.map((v) => `
        <button data-iv="${v.id}" ${v.id === view ? 'aria-pressed="true"' : ''}>${esc(v.label)}</button>`).join('')}
    </div>
    <div class="card mb">${body}</div>

    ${svcRows.length ? `
      <div class="card">
        <p class="label">الدخل حسب الخدمة</p>
        <div class="bars">
          ${svcRows.map(([name, v]) => `
            <div class="bar muted">
              <div class="t"><span>${esc(name)} <span class="muted">×${int(v.n)}</span></span>
                <b>${money(v.v)}</b></div>
              <div class="track"><div class="fill" style="width:${Math.round((v.v / svcTop) * 100)}%"></div></div>
            </div>`).join('')}
        </div>
      </div>` : ''}`;
}

function shareDayPlan(date) {
  const list = S.bookings
    .filter((b) => b.the_date === date && ['confirmed', 'pending', 'done'].includes(b.status))
    .sort((a, b) => a.start_time.localeCompare(b.start_time));
  if (!list.length) return toast('لا مواعيد في هذا اليوم');
  const phone = S.settings?.driver_phone;
  const text = templates.driverDay(list, date);
  if (!phone) {
    navigator.clipboard?.writeText(text);
    return toast('لم يُضبط رقم السائق — نُسخت الخطة', 'ok');
  }
  window.open(waHref(phone, text), '_blank', 'noopener');
}

/* ── Agenda ───────────────────────────────────────────────────────────── */

function renderAgenda() {
  const d = S.agendaDate;
  const list = S.bookings.filter((b) => b.the_date === d && !['cancelled', 'rejected'].includes(b.status))
                         .sort((a, b) => a.start_time.localeCompare(b.start_time));
  const buffer = S.settings?.travel_buffer_min ?? 40;

  const stops = list.map((b, i) => {
    const end = addMinutes(b.start_time, b.duration_min).time;
    const next = list[i + 1];
    let gap = '';
    if (next) {
      const free = addMinutes(next.start_time, 0).absolute - addMinutes(end, 0).absolute;
      gap = free < buffer
        ? `<div class="gap" style="color:var(--danger)">${icon('close', 13)} ${free} دقيقة فقط حتى الموعد التالي — أقل من وقت الانتقال (${buffer})</div>`
        : `<div class="gap">${free} دقيقة حتى الموعد التالي</div>`;
    }
    return `
      <div class="stop">
        ${bookingCard(b, { showDate: false })}
      </div>${gap}`;
  }).join('');

  view.innerHTML = `
    <div class="sec-head"><h2>الأجندة</h2><span class="rule"></span></div>
    <div class="card">
      ${monthGrid()}
      <div class="split" style="margin-top:14px">
        <div class="field" style="margin:0">
          <label class="label" for="agDate">اليوم</label>
          <input class="input" type="date" id="agDate" value="${d}">
        </div>
        <div class="field" style="margin:0">
          <label class="label">&nbsp;</label>
          <button class="btn" id="agToday">اليوم</button>
        </div>
      </div>
    </div>
    <div class="sec-head"><h2>${esc(fmtDate(d))}</h2><span class="rule"></span>
      <span class="count">${list.length ? `${int(list.length)} موعد` : '—'}</span></div>
    ${list.length
      ? `<div class="tl">${stops}</div>
         <button class="btn mt" id="agShare">${icon('driver', 18)} إرسال خطة اليوم للسائق</button>`
      : '<div class="empty"><div class="badge lg" data-icon="calendar"></div><p>لا مواعيد في هذا اليوم.</p></div>'}`;

  bindCards();
  bindMonthGrid();
  document.getElementById('agDate').onchange = (e) => {
    S.agendaDate = e.target.value; S.calMonth = e.target.value.slice(0, 7); render();
  };
  document.getElementById('agToday').onclick = () => {
    S.agendaDate = today(); S.calMonth = today().slice(0, 7); render();
  };
  const sh = document.getElementById('agShare');
  if (sh) sh.onclick = () => shareDayPlan(d);
}

/* ── الحجوزات: بحث وتصفية وتصدير ─────────────────────────────────────── */

function renderBrowse() {
  const rows = filtered();

  const curSrc = SOURCE_FILTERS.find((x) => x.id === S.fSource) || SOURCE_FILTERS[0];
  const curSt  = STATUS_FILTERS.find((x) => x.id === S.fStatus) || STATUS_FILTERS[0];

  const counts = Object.fromEntries(STATUS_FILTERS.map((f) => [f.id,
    S.bookings.filter((b) => f.test(b) && curSrc.test(b) && inWindow(b) && matchesQuery(b, S.q)).length]));
  const srcCounts = Object.fromEntries(SOURCE_FILTERS.map((f) => [f.id,
    S.bookings.filter((b) => f.test(b) && curSt.test(b) && inWindow(b) && matchesQuery(b, S.q)).length]));
  const sum = rows.reduce((n, b) => n + Number(b.price), 0);

  view.innerHTML = `
    <div class="sec-head" style="margin-top:18px"><h2>الحجوزات</h2><span class="rule"></span>
      <span class="count">${int(rows.length)}</span></div>

    <div class="field"><label class="label sr-only" for="q">بحث</label>
      <input class="input" id="q" type="search" value="${esc(S.q)}"
             placeholder="ابحثي بالاسم أو رقم الجوال أو رقم الطلب"></div>

    <div class="chiprow mb">
      ${STATUS_FILTERS.map((f) => `
        <button class="chip" data-st="${f.id}" ${f.id === S.fStatus ? 'aria-pressed="true"' : ''}>
          ${esc(f.label)}<i>${int(counts[f.id])}</i></button>`).join('')}
    </div>
    <div class="chiprow mb">
      ${PERIOD_FILTERS.map((f) => `
        <button class="chip" data-pr="${f.id}" ${f.id === S.fPeriod ? 'aria-pressed="true"' : ''}>
          ${esc(f.label)}</button>`).join('')}
    </div>
    <div class="chiprow mb">
      ${SOURCE_FILTERS.map((f) => `
        <button class="chip" data-sr="${f.id}" ${f.id === S.fSource ? 'aria-pressed="true"' : ''}>
          ${f.id === 'all' ? '' : icon(SOURCES[f.id].icon, 14)}${esc(f.label)}
          <i>${int(srcCounts[f.id])}</i></button>`).join('')}
    </div>
    ${S.fPeriod === 'range' ? `
      <div class="split mb">
        <div class="field" style="margin:0"><label class="label" for="f-from">من</label>
          <input class="input ltr" id="f-from" type="date" value="${esc(S.fFrom)}"></div>
        <div class="field" style="margin:0"><label class="label" for="f-to">إلى</label>
          <input class="input ltr" id="f-to" type="date" value="${esc(S.fTo)}"></div>
      </div>` : ''}

    ${rows.length ? `
      <div class="card mb">
        <div class="leader"><span class="k">إجمالي المعروض</span><span class="d"></span>
          <span class="v">${riyal(sum)}</span></div>
      </div>
      <div class="list">${rows.map((b) => bookingCard(b)).join('')}</div>
      <button class="btn btn-ghost mt" id="bxCsv">${icon('export', 18)} تصدير المعروض (${int(rows.length)})</button>`
    : `<div class="empty"><div class="badge lg" data-icon="search"></div>
        <p>${S.q ? 'لا نتائج لهذا البحث.' : 'لا حجوزات في هذه الشريحة.'}</p></div>`}`;

  bindCards();
  const q = document.getElementById('q');
  q.oninput = () => {
    S.q = q.value;
    // إعادة الرسم تُفقد التركيز، فيُعاد ومعه موضع المؤشّر — الكتابة لا تنقطع.
    const pos = q.selectionStart;
    render(); hydrateIcons(view);
    const nq = document.getElementById('q');
    nq.focus(); try { nq.setSelectionRange(pos, pos); } catch { /* search input */ }
  };
  view.querySelectorAll('[data-st]').forEach((b) => b.onclick = () => {
    S.fStatus = b.dataset.st; render(); hydrateIcons(view);
  });
  view.querySelectorAll('[data-sr]').forEach((b) => b.onclick = () => {
    S.fSource = b.dataset.sr; render(); hydrateIcons(view);
  });
  view.querySelectorAll('[data-pr]').forEach((b) => b.onclick = () => {
    S.fPeriod = b.dataset.pr; render(); hydrateIcons(view);
  });
  const ff = document.getElementById('f-from'), ft = document.getElementById('f-to');
  if (ff) ff.onchange = () => { S.fFrom = ff.value; render(); hydrateIcons(view); };
  if (ft) ft.onchange = () => { S.fTo = ft.value; render(); hydrateIcons(view); };
  const csv = document.getElementById('bxCsv');
  if (csv) csv.onclick = () => exportRows(rows);
}

/* التصدير يأخذ ما هو معروض لا كل ما هو محمَّل: ما تراه الفنانة هو ما ينزل. */
function exportRows(rows) {
  if (!rows.length) return toast('لا شيء لتصديره');
  download(`حجوزات-${today()}.csv`, toCSV(rows, [
    { label: 'رقم الطلب', get: (b) => b.ref },
    { label: 'الاسم',     get: (b) => b.client_name },
    { label: 'الجوال',    get: (b) => prettyPhone(b.client_phone) },
    { label: 'التاريخ',   get: (b) => b.the_date },
    { label: 'الوقت',     get: (b) => fmtTime(b.start_time) },
    { label: 'المدة',     get: (b) => b.duration_min },
    { label: 'الحالة',    get: (b) => statusLabel(b.status) },
    { label: 'المصدر',    get: (b) => (SOURCES[b.source] || SOURCES.admin).label },
    { label: 'الإجمالي',  get: (b) => b.price },
    { label: 'المدفوع',   get: (b) => b.deposit },
    { label: 'المتبقي',   get: (b) => Number(b.price) - Number(b.deposit) },
    { label: 'الخدمات',   get: (b) => groupItems(b.booking_items || [])
        .map((g) => g.n > 1 ? `${g.name} ×${g.n}` : g.name).join(' + ') },
    { label: 'الموقع',    get: (b) => b.loc_text || '' },
  ]));
  toast('نُزّل الملف', 'ok');
}

/* التقويم الشهري: نقطة لكل حالة تحت رقم اليوم، فتُقرأ حالة الشهر كلّه
   من نظرة واحدة قبل فتح أي يوم. */
function monthGrid() {
  const [y, m] = S.calMonth.split('-').map(Number);
  const first = new Date(y, m - 1, 1);
  const lead = first.getDay();                       // الأحد أوّل الأسبوع
  const days = new Date(y, m, 0).getDate();
  const t = today();

  const byDay = {};
  S.bookings.filter((b) => b.the_date.startsWith(S.calMonth)).forEach((b) => {
    const k = b.the_date;
    (byDay[k] ||= new Set()).add(
      ['cancelled', 'rejected', 'no_show'].includes(b.status) ? 'off' : b.status);
  });

  const cells = [];
  for (let i = 0; i < lead; i += 1) cells.push('<span class="cd blank"></span>');
  for (let dn = 1; dn <= days; dn += 1) {
    const iso = `${S.calMonth}-${String(dn).padStart(2, '0')}`;
    const kinds = [...(byDay[iso] || [])].filter((k) => k !== 'off').slice(0, 3);
    cells.push(`<button class="cd${iso === t ? ' today' : ''}" data-cd="${iso}"
      ${iso === S.agendaDate ? 'aria-pressed="true"' : ''}>
      <span>${int(dn)}</span>
      <span class="dots">${kinds.map((k) => `<i class="d-${esc(k)}"></i>`).join('')}</span>
    </button>`);
  }

  const shift = (n) => {
    const d = new Date(y, m - 1 + n, 1);
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
  };
  const MONTHS = ['يناير','فبراير','مارس','أبريل','مايو','يونيو',
                  'يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
  const label = `${MONTHS[m - 1]} ${y}`;

  return `
    <div class="calhead">
      <!-- في RTL يقع «السابق» يمينًا، فيشير سهمُه يمينًا نحو الخارج لا يسارًا. -->
      <button class="iconbtn" data-mv="${shift(-1)}" aria-label="الشهر السابق" data-icon="chevron"></button>
      <b>${esc(label)}</b>
      <button class="iconbtn" data-mv="${shift(1)}" aria-label="الشهر التالي" data-icon="back"></button>
    </div>
    <div class="cal">
      ${WEEKDAYS.map((w) => `<span class="dow">${esc(w.short)}</span>`).join('')}
      ${cells.join('')}
    </div>`;
}
function bindMonthGrid() {
  view.querySelectorAll('[data-mv]').forEach((b) => b.onclick = () => {
    S.calMonth = b.dataset.mv; render(); hydrateIcons(view);
  });
  view.querySelectorAll('[data-cd]').forEach((b) => b.onclick = () => {
    S.agendaDate = b.dataset.cd; render(); hydrateIcons(view);
  });
}

          <button class="iconbtn" data-delov="${o.id}" aria-label="حذف" data-icon="trash"></button>

/* عنوان الفترة: يومٌ واحد يُكتب وحده، والنطاق بطرفيه. */
function overrideSpan(o) {
  const end = o.end_date || o.the_date;
  if (end === o.the_date) return fmtDate(o.the_date, { short: true });
  return `${fmtDate(o.the_date, { short: true, withDow: false })} — ${fmtDate(end, { short: true, withDow: false })}`;
}
function overrideDays(o) {
  const n = daysBetween(o.the_date, o.end_date || o.the_date);
  if (n <= 1) return '';
  return ` · ${n === 2 ? 'يومان' : `${int(n)} ${n <= 10 ? 'أيام' : 'يومًا'}`}`;
}

function editRule(rule) {
  showSheet(rule.id ? 'تعديل الفترة' : 'فترة عمل جديدة', `
    <div class="field">
      <label class="label" for="r-day">اليوم</label>
      <select class="input" id="r-day">
        ${WEEKDAYS.map((d) => `<option value="${d.value}" ${d.value === rule.weekday ? 'selected' : ''}>${d.name}</option>`).join('')}
      </select>
    </div>
    <div class="split mb">
      <div class="field" style="margin:0"><label class="label" for="r-from">من</label>
        <input class="input" type="time" id="r-from" value="${(rule.start_time || '16:00').slice(0, 5)}"></div>
      <div class="field" style="margin:0"><label class="label" for="r-to">إلى</label>
        <input class="input" type="time" id="r-to" value="${(rule.end_time || '22:00').slice(0, 5)}"></div>
    </div>
    <div class="field">
      <label class="label" for="r-label">تسمية <span class="opt">(اختياري)</span></label>
      <input class="input" id="r-label" value="${esc(rule.label || '')}" placeholder="مثال: دوام صباحي">
    </div>
    <div id="r-err"></div>
    <button class="btn btn-primary" id="r-save">حفظ</button>`);

  document.getElementById('r-save').onclick = async () => {
    const from = document.getElementById('r-from').value;
    const to   = document.getElementById('r-to').value;
    if (!from || !to || to <= from) {
      document.getElementById('r-err').innerHTML =
        `<div class="note danger mb">${icon('close', 18)}<span>وقت النهاية يجب أن يكون بعد البداية.</span></div>`;
      return;
    }
    await admin.saveRule({
      ...(rule.id ? { id: rule.id } : {}),
      weekday: Number(document.getElementById('r-day').value),
      start_time: from, end_time: to,
      label: document.getElementById('r-label').value.trim() || null,
      active: true,
    });
    closeSheet(sheet); toast('حُفظت الفترة', 'ok'); reload();
  };
}

function editOverride() {
  showSheet('فترة استثنائية', `
    <div class="split mb">
      <div class="field" style="margin:0">
        <label class="label" for="o-date">من تاريخ</label>
        <input class="input" type="date" id="o-date" min="${today()}" value="${today()}">
      </div>
      <div class="field" style="margin:0">
        <label class="label" for="o-end">إلى تاريخ</label>
        <input class="input" type="date" id="o-end" min="${today()}" value="${today()}">
      </div>
    </div>
    <p class="hint" id="o-span" style="margin:-6px 0 14px">يوم واحد.</p>
    <div class="field">
      <label class="label">النوع</label>
      <div class="btn-row">
        <button class="choice" id="o-closed" aria-pressed="true" style="justify-content:center">إجازة</button>
        <button class="choice" id="o-custom" aria-pressed="false" style="justify-content:center">ساعات خاصة</button>
      </div>
    </div>
    <div class="split mb hide" id="o-hours">
      <div class="field" style="margin:0"><label class="label" for="o-from">من</label>
        <input class="input" type="time" id="o-from" value="09:00"></div>
      <div class="field" style="margin:0"><label class="label" for="o-to">إلى</label>
        <input class="input" type="time" id="o-to" value="13:00"></div>
    </div>
    <div class="field">
      <label class="label" for="o-note">ملاحظة <span class="opt">(اختياري)</span></label>
      <input class="input" id="o-note" placeholder="مثال: سفر">
    </div>
    <div id="o-err"></div>
    <button class="btn btn-primary" id="o-save">حفظ</button>`);

  let kind = 'closed';
  const pick = (k) => {
    kind = k;
    document.getElementById('o-closed').setAttribute('aria-pressed', String(k === 'closed'));
    document.getElementById('o-custom').setAttribute('aria-pressed', String(k === 'custom'));
    document.getElementById('o-hours').classList.toggle('hide', k !== 'custom');
    span();
  };
  document.getElementById('o-closed').onclick = () => pick('closed');
  document.getElementById('o-custom').onclick = () => pick('custom');

  /* النهاية لا تسبق البداية: يُجرّ الطرف معها بدل أن يُرفض الإدخال. */
  const oFrom = document.getElementById('o-date');
  const oTo   = document.getElementById('o-end');
  function span() {
    oTo.min = oFrom.value || today();
    if (oTo.value && oFrom.value && oTo.value < oFrom.value) oTo.value = oFrom.value;
    const n = daysBetween(oFrom.value, oTo.value);
    const what = kind === 'closed' ? 'إجازة' : 'ساعات خاصّة';
    document.getElementById('o-span').textContent =
      !n ? 'اختاري التاريخين.'
      : n === 1 ? `يوم واحد — ${what}.`
      : n === 2 ? `يومان — ${what}.`
      : `${int(n)} ${n <= 10 ? 'أيام' : 'يومًا'} — ${what}.`;
  }
  oFrom.oninput = () => { if (oTo.value < oFrom.value) oTo.value = oFrom.value; span(); };
  oTo.oninput = span;
  span();

  document.getElementById('o-save').onclick = async () => {
    const row = {
      the_date: oFrom.value,
      end_date: oTo.value || oFrom.value,
      kind,
      note: document.getElementById('o-note').value.trim() || null,
      start_time: kind === 'custom' ? document.getElementById('o-from').value : null,
      end_time:   kind === 'custom' ? document.getElementById('o-to').value   : null,
    };
    if (!row.the_date) return;
    if (row.end_date < row.the_date) {
      document.getElementById('o-err').innerHTML =
        `<div class="note danger mb">${icon('close', 18)}<span>تاريخ النهاية قبل البداية.</span></div>`;
      return;
    }
    if (kind === 'custom' && (!row.start_time || !row.end_time || row.end_time <= row.start_time)) {
      document.getElementById('o-err').innerHTML =
        `<div class="note danger mb">${icon('close', 18)}<span>وقت النهاية يجب أن يكون بعد البداية.</span></div>`;
      return;
    }
    try {
      await admin.saveOverride(row);
      closeSheet(sheet); toast('حُفظ اليوم', 'ok'); reload();
    } catch (err) {
      document.getElementById('o-err').innerHTML =
        `<div class="note danger mb">${icon('close', 18)}<span>${esc(err.message)}</span></div>`;
    }
  };
}

function openTemplate(t) {
  const isNew = !t;
  t = t || { title: '', body: '', sort: 100, pinned: false, builtin: false };
  showSheet(isNew ? 'رسالة تواصل جديدة' : esc(t.title), `
    <div class="field"><label class="label" for="t-title">اسم الرسالة
      <span class="opt">(يظهر لكِ في القائمة فقط)</span></label>
      <input class="input" id="t-title" value="${esc(t.title)}" placeholder="مثال: طلب تعديل الموعد"></div>
    <div class="field"><label class="label" for="t-body">نصّ الرسالة</label>
      <textarea class="input" id="t-body" rows="7">${esc(t.body)}</textarea></div>

    <p class="label">اضغطي لإدراج قيمة تتبدّل تلقائيًّا:</p>
    <div class="chiprow mb" id="t-fields">
      ${TEMPLATE_FIELDS.map((f) => `<button class="chip" type="button" data-f="${esc(f)}">${esc(f)}</button>`).join('')}
    </div>

    <div class="card mb"><p class="label">المعاينة</p>
      <p class="hint" id="t-prev" style="white-space:pre-wrap;margin:0"></p></div>

    <div class="rowline" style="border:0;padding:0 0 12px">
      <span class="grow"><span class="t">ثبّتيها في أعلى القائمة</span>
        <span class="s">تظهر أوّلًا عند الضغط على «تواصل»</span></span>
      <input type="checkbox" id="t-pin" ${t.pinned ? 'checked' : ''}>
    </div>

    <div id="t-err"></div>
    <div class="btn-row">
      ${isNew ? '' : '<button class="btn btn-danger" id="t-del">إخفاء</button>'}
      <button class="btn btn-primary" id="t-save">حفظ الرسالة</button>
    </div>`);
  hydrateIcons(sheet);

  const g = (id) => document.getElementById(id);
  const sample = S.bookings?.[0] || { client_name: 'أماني العنزي', the_date: today(),
    start_time: '13:00', price: 3300, deposit: 300, loc_text: 'حي القادسية' };

  const preview = () => { g('t-prev').textContent = fillTemplate(g('t-body').value, sample,
    { business: S.settings?.business_name, link: 'https://eman-aalmousa.com/?t=…' }); };
  g('t-body').oninput = preview; preview();

  // الإدراج عند مؤشّر الكتابة لا في آخر النصّ — وإلا صار الحقل عبئًا.
  g('t-fields').querySelectorAll('[data-f]').forEach((b) => b.onclick = () => {
    const el = g('t-body'), i = el.selectionStart ?? el.value.length;
    el.value = el.value.slice(0, i) + b.dataset.f + el.value.slice(el.selectionEnd ?? i);
    el.focus(); el.setSelectionRange(i + b.dataset.f.length, i + b.dataset.f.length);
    preview();
  });

  g('t-save').onclick = async () => {
    const title = g('t-title').value.trim(), body = g('t-body').value.trim();
    if (title.length < 2) { g('t-err').innerHTML = note('اكتبي اسمًا للرسالة.'); return; }
    if (body.length < 4)  { g('t-err').innerHTML = note('اكتبي نصّ الرسالة.'); return; }
    const btn = g('t-save'); btn.disabled = true; btn.textContent = 'جارٍ الحفظ…';
    try {
      await admin.saveTemplate({ ...(t.id ? { id: t.id } : {}), title, body,
        pinned: g('t-pin').checked, sort: Number(t.sort) || 100, builtin: !!t.builtin, active: true });
      closeSheet(sheet); toast('حُفظت الرسالة', 'ok'); reload();
    } catch (e) {
      btn.disabled = false; btn.textContent = 'حفظ الرسالة';
      g('t-err').innerHTML = note(isOffline(e) ? NET_MSG : e.message);
    }
  };
  if (!isNew) document.getElementById('t-del').onclick = () =>
    confirmThen('إخفاء هذه الرسالة؟', async () => {
      try { await admin.deleteTemplate(t.id); closeSheet(sheet); toast('أُخفيت', 'ok'); reload(); }
      catch (e) { toast(e.message, 'danger'); }
    });
}

        <span class="s">أوقفيها لخدمة تحجزينها أنتِ فقط</span></span><span class="sw"></span></label>
    <label class="toggle mb"><input type="checkbox" id="s-group" ${s.group_discount ? 'checked' : ''}>
      <span class="grow"><span class="t">يشملها خصم المجموعة</span>
        <span class="s">يُطبَّق تلقائيًا من شخصين فأكثر، بالمبلغ المحدَّد في الإعدادات</span></span><span class="sw"></span></label>
    <div id="s-err"></div>
    <div class="btn-row">
      ${s.id ? '<button class="btn btn-danger" id="s-del">إخفاء</button>' : ''}
      <button class="btn btn-primary" id="s-save">حفظ</button>
    </div>`);

  let ico = s.icon;
  view.ownerDocument.querySelectorAll('[data-ico]').forEach((b) => b.onclick = () => {
    ico = b.dataset.ico;
    document.querySelectorAll('[data-ico]').forEach((x) =>
      x.setAttribute('aria-pressed', String(x.dataset.ico === ico)));
  });

  /* ── الوسائط ───────────────────────────────────────────────────────
     يُرفع الملف فورًا ويُحتفظ بمساره في الذاكرة؛ الحفظ يثبّته على الخدمة.
     ما رُفع ثم بُدِّل قبل الحفظ يُمحى من التخزين، فلا يتراكم يتيمٌ فيه. */
  const M = {
    kind: s.media_kind || null, path: s.media_path || null, poster: s.poster_path || null,
    x: Number(s.media_x ?? 50), y: Number(s.media_y ?? 50), zoom: Number(s.media_zoom ?? 1),
  };
  const orphans = [...carried];

  const paint = () => {
    document.querySelectorAll('[data-prev], [data-poster] img').forEach((el) => {
      el.style.setProperty('--x', `${M.x}%`);
      el.style.setProperty('--y', `${M.y}%`);
      el.style.setProperty('--z', String(M.zoom));
    });
  };

  const pick = (btnId, fileId, want) => {
    const btn = document.getElementById(btnId), inp = document.getElementById(fileId);
    if (!btn || !inp) return;
    btn.onclick = () => inp.click();
    inp.onchange = async () => {
      const f = inp.files?.[0]; if (!f) return;
      btn.disabled = true; const label = btn.textContent; btn.textContent = 'جارٍ الرفع…';
      try {
        const up = await uploadServiceMedia(f, want);
        if (want === 'video') { if (M.path) orphans.push(M.path); M.kind = 'video'; M.path = up.path; }
        else { if (M.poster) orphans.push(M.poster); M.poster = up.path; }
        redraw();
      } catch (err) {
        document.getElementById('s-err').innerHTML = note(err.message || 'تعذّر الرفع');
        btn.disabled = false; btn.textContent = label;
      }
      inp.value = '';
    };
  };

  const drop = (btnId, what) => {
    const btn = document.getElementById(btnId); if (!btn) return;
    btn.onclick = () => {
      if (what === 'video') { if (M.path) orphans.push(M.path); M.path = null; M.kind = M.poster ? 'image' : null; }
      else { if (M.poster) orphans.push(M.poster); M.poster = null; if (M.kind === 'image') M.kind = null; }
      redraw();
    };
  };

  /* إعادة الرسم تفتح المحرّر من جديد بالقيم الحاليّة: أبسط من تحديث ستّة
     عناصر يدويًّا، ولا يضيع شيء لأنّ الحقول تُقرأ قبل إعادة الفتح. */
  function redraw() {
    const keep = {
      ...s, name: document.getElementById('s-name').value,
      description: document.getElementById('s-desc').value,
      price: Number(document.getElementById('s-price').value),
      duration_min: Number(document.getElementById('s-dur').value),
      deposit_amount: Number(document.getElementById('s-dep').value),
      bookable_by_client: document.getElementById('s-public').checked,
      group_discount: document.getElementById('s-group').checked,
      icon: ico,
      media_kind: M.kind, media_path: M.path, poster_path: M.poster,
      media_x: M.x, media_y: M.y, media_zoom: M.zoom,
    };
    editService(keep, orphans);
  }

  pick('s-vidpick', 's-vidfile', 'video');
  pick('s-imgpick', 's-imgfile', 'image');
  drop('s-vidrm', 'video');
  drop('s-imgrm', 'image');

  document.querySelectorAll('[data-pos]').forEach((b) => b.onclick = () => {
    const [x, y] = b.dataset.pos.split(',').map(Number);
    M.x = x; M.y = y;
    const vy = document.getElementById('s-vy'); if (vy) vy.value = String(y);
    document.querySelectorAll('[data-pos]').forEach((o) =>
      o.setAttribute('aria-pressed', String(o === b)));
    paint();
  });
  const zoomEl = document.getElementById('s-zoom');
  if (zoomEl) zoomEl.oninput = () => { M.zoom = Number(zoomEl.value); paint(); };
  const vyEl = document.getElementById('s-vy');
  if (vyEl) vyEl.oninput = () => { M.y = Number(vyEl.value); paint(); };
  paint();

  document.getElementById('s-save').onclick = async () => {
    const name = document.getElementById('s-name').value.trim();
    const price = Number(document.getElementById('s-price').value);
    const dur = Number(document.getElementById('s-dur').value);
    const dep = Number(document.getElementById('s-dep').value);
    const err = document.getElementById('s-err');
    if (name.length < 2) { err.innerHTML = note('اكتبي اسم الخدمة.'); return; }
    if (!(dur >= 15 && dur <= 600)) { err.innerHTML = note('المدة بين 15 و600 دقيقة.'); return; }
    if (!(price >= 0)) { err.innerHTML = note('السعر غير صحيح.'); return; }
    if (price === 0 && !confirm('السعر صفر. هل تريدين المتابعة؟')) return;
    // القاعدة ترفض عربونًا يتجاوز السعر، فيُقال هنا بلغة مفهومة بدل رسالة خطأ من الخادم.
    if (!(dep >= 0) || dep > price) {
      err.innerHTML = note('العربون بين صفر وسعر الخدمة.'); return;
    }
    await admin.saveService({
      ...(s.id ? { id: s.id } : {}), name, icon: ico, price, duration_min: dur,
      deposit_amount: dep,
      description: document.getElementById('s-desc').value.trim() || null,
      bookable_by_client: document.getElementById('s-public').checked,
      group_discount: document.getElementById('s-group').checked,
      media_kind: M.kind, media_path: M.path, poster_path: M.poster,
      media_x: M.x, media_y: M.y, media_zoom: M.zoom,
      active: true, sort: s.sort ?? 0,
    });
    // ما استُبدل قبل الحفظ لم يعد يشير إليه شيء، فيُمحى بدل أن يتراكم.
    if (orphans.length) await removeServiceMedia(orphans).catch(() => {});
    closeSheet(sheet); toast('حُفظت الخدمة', 'ok'); reload();
  };
  const del = document.getElementById('s-del');
  if (del) del.onclick = async () => {
    await admin.deleteService(s.id);
    closeSheet(sheet); toast('أُخفيت الخدمة — الحجوزات السابقة لم تتأثر', 'ok'); reload();
  };
}

  /* ── حذف الحجوزات ────────────────────────────────────────────────
     خطوتان دائمًا: تُعرض العدّة قبل الحذف، ثم يُطلب تأكيد. و«كل الحجوزات»
     يلزمها كتابة كلمة — لأن ضغطة واحدة لا يصحّ أن تمسح عمل موسم. */
  {
    const g = (id) => document.getElementById(id);
    const scope = g('pg-scope'), dates = g('pg-dates'), cnt = g('pg-count');
    const conf = g('pg-confirm'), word = g('pg-word'), go = g('pg-go'), perr = g('pg-err');
    let last = { from: null, to: null, count: 0 };

    const shift = (n) => addDays(today(), n);
    function bounds() {
      switch (scope.value) {
        case 'week':   return [today(), shift(7)];
        case 'month':  return [today(), shift(30)];
        case 'future': return [today(), null];
        case 'past':   return [null, shift(-1)];
        case 'range':  return [g('pg-from').value || null, g('pg-to').value || null];
        default:       return [null, null];
      }
    }

    let seq = 0;
    async function preview() {
      const mine = ++seq;
      const [from, to] = bounds();
      dates.hidden = scope.value !== 'range';
      conf.hidden = scope.value !== 'all';
      perr.innerHTML = '';
      if (scope.value === 'range' && (!from || !to)) {
        cnt.textContent = 'اختاري تاريخي البداية والنهاية.';
        go.disabled = true; return;
      }
      cnt.textContent = 'جارٍ العدّ…'; go.disabled = true;
      try {
        const r = await admin.purgePreview(from, to);
        if (mine !== seq) return;                      // ردّ قديم وصل متأخّرًا
        last = { from, to, count: r.count };
        cnt.textContent = r.count === 0
          ? 'لا حجوزات في هذا النطاق.'
          : `سيُحذف ${r.count === 1 ? 'حجز واحد' : r.count === 2 ? 'حجزان'
                : r.count <= 10 ? `${r.count} حجوزات` : `${r.count} حجزًا`}` +
            (r.receipts.length ? ` ومعها ${r.receipts.length} صورة إيصال.` : '.');
        gate();
      } catch (e) {
        if (mine !== seq) return;
        cnt.textContent = '—'; perr.innerHTML = note(e.message); go.disabled = true;
      }
    }
    function gate() {
      go.disabled = last.count === 0
        || (scope.value === 'all' && word.value.trim() !== 'حذف');
    }

    scope.onchange = preview;
    g('pg-from').onchange = preview;
    g('pg-to').onchange = preview;
    word.oninput = gate;
    preview();

    go.onclick = async () => {
      if (go.disabled) return;
      const label = scope.options[scope.selectedIndex].text.split('—')[0].trim();
      if (!confirm(`سيُحذف ${last.count} حجزًا (${label}) نهائيًا بلا تراجع.\nمتأكدة؟`)) return;
      go.disabled = true; perr.innerHTML = '';
      const was = go.innerHTML;
      try {
        /* الحذف الجماعي هو أرجح أسباب الفقد، فتُؤخذ نسخة قبله دائمًا —
           لا بوصفها خيارًا بل شرطًا: إن تعذّرت النسخة لم يجرِ الحذف. */
        go.textContent = 'جارٍ أخذ نسخة احتياطية…';
        await backups.create({ auto: true });
        go.textContent = 'جارٍ الحذف…';
        const r = await admin.purgeBookings(last.from, last.to);
        toast(`حُذف ${r.count} حجزًا — النسخة محفوظة`, 'ok');
        word.value = ''; reload();
      } catch (e) {
        perr.innerHTML = note(isOffline(e) ? NET_MSG : e.message);
        go.innerHTML = was; hydrateIcons(go); gate();
      }
    };
  }

  /* ── النسخ السحابية ─────────────────────────────────────────────────
     القائمة تُبنى من التخزين نفسه لا من حالةٍ محفوظة، فما تراه هو ما هناك. */
  const bkList = document.getElementById('bkList');
  const bkMsg  = document.getElementById('bkMsg');

  async function drawBackups() {
    let rows = [];
    try { rows = await backups.list(); }
    catch (e) {
      bkList.innerHTML = `<p class="hint" style="margin:0">تعذّرت القراءة: ${esc(e.message)}</p>`;
      return;
    }
    if (!rows.length) {
      bkList.innerHTML = '<p class="hint" style="margin:0">لا نسخ بعد. أنشئي أوّل نسخة الآن.</p>';
      return;
    }
    bkList.innerHTML = `<div class="list">${rows.map((r) => `
      <div class="rowline bkrow">
        <span class="grow">
          <span class="t">${esc(fmtDate(isoDate(r.at || new Date())))}
            ${r.at ? `· ${esc(fmtTime(`${String(r.at.getHours()).padStart(2, '0')}:${String(r.at.getMinutes()).padStart(2, '0')}`))}` : ''}</span>
          <span class="s">${r.auto ? 'تلقائية قبل حذف جماعي · ' : ''}${int(Math.round((r.size || 0) / 1024))} كِب</span>
        </span>
        <span class="bkacts">
          <button class="btn btn-soft xs" data-bk-get="${esc(r.name)}">استعادة</button>
          <button class="btn btn-ghost xs" data-bk-dl="${esc(r.name)}">تنزيل</button>
          <button class="btn btn-ghost xs" data-bk-rm="${esc(r.name)}">حذف</button>
        </span>
      </div>`).join('')}</div>`;
    hydrateIcons(bkList);

    bkList.querySelectorAll('[data-bk-dl]').forEach((b) => b.onclick = async () => {
      try { window.open(await backups.link(b.dataset.bkDl), '_blank'); }
      catch (e) { toast(e.message, 'danger'); }
    });

    bkList.querySelectorAll('[data-bk-rm]').forEach((b) => b.onclick = async () => {
      if (!confirm('حذف هذه النسخة الاحتياطية؟')) return;
      b.disabled = true;
      try { await backups.remove(b.dataset.bkRm); toast('حُذفت النسخة', 'ok'); drawBackups(); }
      catch (e) { b.disabled = false; toast(e.message, 'danger'); }
    });

    bkList.querySelectorAll('[data-bk-get]').forEach((b) => b.onclick = async () => {
      const name = b.dataset.bkGet;
      if (!confirm(`استعادة نسخة ${name}؟\nسيعود المحذوف، ولن يتغيّر أو يُحذف أيّ حجزٍ قائم.`)) return;
      b.disabled = true; const was = b.textContent; b.textContent = 'جارٍ…';
      bkMsg.innerHTML = '';
      try {
        const r = await backups.restore(name);
        const back = Number(r.bookings || 0);
        bkFlash = `<div class="note ok mb">${icon('check', 18)}<span>${
          back ? `عاد ${int(back)} ${back === 1 ? 'حجز' : back <= 10 ? 'حجوزات' : 'حجزًا'}`
               : 'لا شيء ناقص — كل ما في النسخة موجود بالفعل'
        }${Number(r.receipts_restored) ? ` و${int(r.receipts_restored)} إيصالًا` : ''}.</span></div>`;
        bkMsg.innerHTML = bkFlash; hydrateIcons(bkMsg);
        toast('تمّت الاستعادة', 'ok');
        reload();
      } catch (e) {
        bkMsg.innerHTML = note(isOffline(e) ? NET_MSG : e.message);
      } finally { b.disabled = false; b.textContent = was; }
    });
  }
  drawBackups();

  document.getElementById('bkNew').onclick = async (ev) => {
    const b = ev.currentTarget; b.disabled = true;
    const was = b.innerHTML; b.textContent = 'جارٍ أخذ النسخة…'; bkMsg.innerHTML = '';
    try {
      const r = await backups.create();
      const c = r.counts || {};
      bkFlash = `<div class="note ok mb">${icon('check', 18)}<span>حُفظت النسخة —
        ${int(c.bookings || 0)} حجز و${int(c.services || 0)} خدمة${
        r.receipts_total ? ` و${int(r.receipts_copied)} من ${int(r.receipts_total)} إيصال` : ''}.</span></div>`;
      bkMsg.innerHTML = bkFlash; hydrateIcons(bkMsg);
      drawBackups();
    } catch (e) {
      bkMsg.innerHTML = note(isOffline(e) ? NET_MSG : e.message);
    } finally { b.disabled = false; b.innerHTML = was; hydrateIcons(b); }
  };

  document.getElementById('btnBackup').onclick = async () => {
    const data = await admin.exportAll();
    download(`نسخة-احتياطية-${today()}.json`, JSON.stringify(data, null, 2));
    toast('نُزّلت النسخة', 'ok');
  };

  document.getElementById('btnCsv').onclick = () => {
    const csv = toCSV(S.bookings, [
      { label: 'رقم الطلب', get: (b) => b.ref },
      { label: 'الاسم',      get: (b) => b.client_name },
      { label: 'الجوال',     get: (b) => prettyPhone(b.client_phone) },
      { label: 'التاريخ',    get: (b) => b.the_date },
      { label: 'الوقت',      get: (b) => fmtTime(b.start_time) },
      { label: 'المدة',      get: (b) => b.duration_min },
      { label: 'الخدمات',    get: (b) => groupItems(b.booking_items || [])
          .map((g) => g.n > 1 ? `${g.name} ×${g.n}` : g.name).join(' + ') },
      { label: 'الموقع',     get: (b) => b.loc_text || '' },
      { label: 'الإجمالي',   get: (b) => b.price },
      { label: 'المدفوع',    get: (b) => b.deposit },
      { label: 'المتبقي',    get: (b) => Number(b.price) - Number(b.deposit) },
      { label: 'الحالة',     get: (b) => statusLabel(b.status) },
    ]);
    download(`حجوزات-${today()}.csv`, csv, 'text/csv');
    toast('نُزّل الملف', 'ok');
  };
}

/* ── Booking detail ───────────────────────────────────────────────────── */

}

    ${b.cancel_requested ? `<div class="note warn">${icon('clock', 17)}

                  border:1px solid var(--line);display:block"></a>`;

      await admin.update(b.id, { deposit: Number(b.deposit_due || 0) });
      closeSheet(sheet); toast('سُجّل استلام العربون', 'ok'); reload();
