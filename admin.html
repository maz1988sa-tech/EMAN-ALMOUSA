    const v = btn.dataset.dep === 'q' ? Math.round(total / 4)
            : btn.dataset.dep === 'h' ? Math.round(total / 2) : total;
    document.getElementById('d-dep').value = v;
  });

  document.getElementById('d-edit').onclick = () => openEdit(b);

  document.getElementById('d-money').onclick = async () => {
    const price = Number(document.getElementById('d-price').value);
    const dep   = Number(document.getElementById('d-dep').value);
    const err = document.getElementById('d-err');
    if (!(price >= 0) || !(dep >= 0)) { err.innerHTML = note('المبالغ غير صحيحة.'); return; }
    if (dep > price) { err.innerHTML = note('المدفوع أكبر من الإجمالي.'); return; }
    err.innerHTML = '';
    // price_override records the charged total explicitly, so the line items
    // keep their own real prices and the two never contradict each other.
    await admin.update(b.id, { price_override: price === Number(b.items_total) ? null : price, deposit: dep });
    closeSheet(sheet); toast('حُفظت المبالغ', 'ok'); reload();
  };

  renderActions(b);
}

function renderActions(b) {
  const host = document.getElementById('d-actions');
  const act = (label, cls, fn, ico) => {
    const el = document.createElement('button');
    el.className = `btn ${cls}`;
    el.innerHTML = `${ico ? icon(ico, 18) : ''} ${label}`;
    el.onclick = fn;
    return el;
  };
  const set = async (status, msg) => {
    await admin.setStatus(b.id, status);
    closeSheet(sheet); toast(msg, 'ok'); reload();
  };

  host.innerHTML = '';
  const row = document.createElement('div');
  row.className = 'btn-row mb';

  if (b.status === 'pending') {
    row.append(
      act('تأكيد الحجز', 'btn-primary', () => set('confirmed', 'تم تأكيد الحجز'), 'check'),
      act('اعتذار', 'btn-danger', () => confirmThen('الاعتذار عن هذا الطلب؟', () => set('rejected', 'تم الاعتذار'))),
    );
  } else if (b.status === 'confirmed') {
    const finish = async () => {
      const rest = Number(b.price) - Number(b.deposit);
      if (rest > 0) {
        // الحجز يُقفل بمتبقٍّ معلّق لو لم يُسأل، فيبقى في المستحقات بلا سبب.
        const paid = confirm(`تبقّى ${money(rest)} ر.س على ${b.client_name}.\n`
          + 'هل استلمتِ المبلغ كاملًا؟\n\nنعم = يُقفل مسدّدًا · إلغاء = يبقى في المستحقات');
        if (paid) await admin.update(b.id, { deposit: Number(b.price) });
      }
      await set('done', rest > 0 ? 'تم وضعه مكتملًا' : 'تم وضعه مكتملًا');
    };
    row.append(
      act('تم الإنجاز', 'btn-primary', finish, 'check'),
      act('لم تحضر', 'btn-ghost', () => confirmThen('تسجيل عدم الحضور؟', () => set('no_show', 'سُجّل عدم الحضور'))),
    );
  } else {
    row.append(act('إعادة للمؤكدة', 'btn-ghost', () => set('confirmed', 'أُعيد الحجز'), 'back'));
  }
  host.append(row);

  if (['pending', 'confirmed'].includes(b.status)) {
    const cancel = act('إلغاء الحجز', 'btn-danger',
      () => confirmThen(`إلغاء حجز ${b.client_name}؟`, () => set('cancelled', 'أُلغي الحجز')));
    host.append(cancel);
  }
  hydrateIcons(host);
}

/* تعديل الحجز: كل ما يمكن أن يتغيّر بعد الاتفاق — الموعد أولها. إعادة
   الجدولة كانت مستحيلة من اللوحة، فكان لا بدّ من فتح قاعدة البيانات لتغيير
   ساعة. الخدمات تُستبدل دفعة واحدة فيُعاد حساب السعر والمدة من القاعدة. */
function openEdit(b) {
  const svcs = S.services.filter((s) => s.active);
  const items = b.booking_items || [];
  const counts = {};
  items.forEach((i) => { if (i.service_id) counts[i.service_id] = (counts[i.service_id] || 0) + 1; });
  /* عناصر تشير إلى خدمة حُذفت أو أُخفيت لا تظهر في العدّادات. لو استُبدلت
     القائمة عندئذٍ ضاعت خدمات الحجز، فتُترك كما هي ما لم تُلمس العدّادات. */
  /* السعر المحفوظ لكل خدمة يعود كما هو، فتعديلٌ في الموعد لا يمحو سعرًا
     خاصًّا اتُّفق عليه. */
  const saved = {};
  items.forEach((i) => { if (i.service_id && saved[i.service_id] === undefined) saved[i.service_id] = Number(i.price); });
  const mapped = Object.values(counts).reduce((n, v) => n + v, 0);
  const orphan = items.length - mapped;
  const origKey = Object.entries(counts).sort()
    .map(([k, v]) => `${k}:${v}@${Number(saved[k] ?? 0)}`).join(',');

  showSheet(`تعديل — ${b.client_name}`, `
    <div class="field"><label class="label" for="e-name">اسم العميلة</label>
      <input class="input" id="e-name" value="${esc(b.client_name)}"></div>
    <div class="field"><label class="label" for="e-phone">رقم الجوال</label>
      <input class="input ltr" id="e-phone" type="tel" inputmode="numeric"
             value="${esc(prettyPhone(b.client_phone).replace(/\s/g, ''))}"></div>

    <div class="split mb">
      <div class="field" style="margin:0"><label class="label" for="e-date">التاريخ</label>
        <input class="input ltr" type="date" id="e-date" value="${esc(b.the_date)}"></div>
      <div class="field" style="margin:0"><label class="label" for="e-time">الوقت</label>
        <input class="input ltr" type="time" id="e-time" value="${esc(String(b.start_time).slice(0, 5))}"></div>
    </div>

    <div class="card mb">
      <p class="label">الخدمات والأشخاص</p>
      <div class="list">
        ${svcs.map((sv) => `
          <div class="rowline">
            <span class="grow"><span class="t">${esc(sv.name)}</span>
              <span class="s">${money(sv.price)} ر.س · ${int(sv.duration_min)}د</span></span>
            <span class="stepper">
              <button type="button" data-ed="-" data-sid="${esc(sv.id)}" aria-label="إنقاص">−</button>
              <span class="val" data-ev="${esc(sv.id)}">${int(counts[sv.id] || 0)}</span>
              <button type="button" data-ed="+" data-sid="${esc(sv.id)}" aria-label="زيادة">+</button>
            </span>
          </div>
          <div class="priceline" data-ep="${esc(sv.id)}" ${counts[sv.id] ? '' : 'hidden'}>
            <label class="label" for="ep-${esc(sv.id)}">سعر خاص لكل شخص</label>
            <input class="input ltr" id="ep-${esc(sv.id)}" data-eprice="${esc(sv.id)}"
                   type="number" min="0" inputmode="numeric"
                   value="${Number(saved[sv.id] ?? sv.price)}">
          </div>`).join('')}
      </div>
      <div class="leader" style="margin-top:8px"><span class="k">الإجمالي بعد التعديل</span>
        <span class="d"></span><span class="v" id="e-sum">—</span></div>
      <p class="hint" id="e-disc" hidden style="color:var(--rose)"></p>
      <p class="hint" id="e-dur">—</p>
      ${orphan > 0 ? `<div class="note warn" style="margin-top:10px">${icon('clock', 18)}
        <span>${int(orphan)} من خدمات هذا الحجز لم تعد في قائمة الخدمات النشطة، فلا تظهر أعلاه.
        لن تُمسّ ما لم تغيّري العدّادات.</span></div>` : ''}
    </div>

    <div class="field"><label class="label" for="e-loc">الحي والمدينة</label>
      <input class="input" id="e-loc" value="${esc(b.loc_text || '')}"></div>
    <div class="field"><label class="label" for="e-map">رابط خرائط قوقل <span class="opt">(اختياري)</span></label>
      <input class="input ltr" id="e-map" dir="ltr" placeholder="https://maps.app.goo.gl/..."
             value="${esc(b.loc_map || '')}"></div>
    <div class="field"><label class="label" for="e-notes">ملاحظات العميلة</label>
      <textarea class="input" id="e-notes" rows="2">${esc(b.client_notes || '')}</textarea></div>

    <div id="e-err"></div>
    <div class="btn-row">
      <button class="btn btn-ghost" id="e-back">رجوع</button>
      <button class="btn btn-primary" id="e-save">حفظ التعديل</button>
    </div>`);

  const g = (id) => document.getElementById(id);
  const readCounts = () => Object.fromEntries(svcs.map((sv) =>
    [sv.id, Number(document.querySelector(`[data-ev="${CSS.escape(sv.id)}"]`).textContent) || 0]));
  const ePrice = (sv) => {
    const el = document.querySelector(`[data-eprice="${CSS.escape(sv.id)}"]`);
    const v = Number(el?.value);
    return isFinite(v) && v >= 0 ? v : Number(saved[sv.id] ?? sv.price);
  };
  function recompute() {
    const c = readCounts();
    let total = 0, dur = 0, n = 0, grp = 0;
    svcs.forEach((sv) => {
      total += ePrice(sv) * c[sv.id]; dur += sv.duration_min * c[sv.id]; n += c[sv.id];
      if (sv.group_discount) grp += c[sv.id];
      const box = document.querySelector(`[data-ep="${CSS.escape(sv.id)}"]`);
      if (box) box.hidden = c[sv.id] === 0;
    });
    const per = Number(S.settings?.group_discount_amount || 0);
    const disc = (per > 0 && grp >= 2) ? Math.min(per * grp, total) : 0;
    g('e-sum').textContent = n ? `${money(total - disc)} ر.س` : '—';
    const dline = g('e-disc');
    dline.hidden = !disc;
    if (disc) dline.textContent = `خصم المجموعة (${int(grp)} أشخاص) −${money(disc)} ر.س`;
    g('e-dur').textContent = n ? `${int(n)} خدمة · ${fmtDuration(Math.max(dur, 15))}` : 'اختاري خدمة واحدة على الأقل.';
  }
  document.querySelectorAll('[data-eprice]').forEach((el) => el.oninput = recompute);
  document.querySelectorAll('[data-ed]').forEach((btn) => btn.onclick = () => {
    const cell = document.querySelector(`[data-ev="${CSS.escape(btn.dataset.sid)}"]`);
    const next = Math.max(0, Math.min(12, Number(cell.textContent) + (btn.dataset.ed === '+' ? 1 : -1)));
    cell.textContent = String(next); recompute();
  });
  recompute();
  g('e-back').onclick = () => openBooking(b.id);

  g('e-save').onclick = async () => {
    const err = g('e-err');
    const name = g('e-name').value.trim();
    const phone = normalisePhone(g('e-phone').value);
    const date = g('e-date').value, time = g('e-time').value;
    const c = readCounts();
    const chosen = svcs.flatMap((sv) => Array.from({ length: c[sv.id] }, () => sv));
    const map = g('e-map').value.trim();
    if (name.length < 2) { err.innerHTML = note('اكتبي اسم العميلة.'); return; }
    if (!phone) { err.innerHTML = note('رقم الجوال غير صحيح.'); return; }
    if (!date || !time) { err.innerHTML = note('اختاري التاريخ والوقت.'); return; }
    if (!chosen.length && !orphan) { err.innerHTML = note('اختاري خدمة واحدة على الأقل.'); return; }
    if (map && !/^https:\/\/\S+$/i.test(map)) { err.innerHTML = note('رابط الخريطة يجب أن يبدأ بـ https://'); return; }
    err.innerHTML = '';
    const btn = g('e-save'); btn.disabled = true; btn.textContent = 'جارٍ الحفظ…';
    const nowKey = Object.entries(c).filter(([, v]) => v > 0).sort()
      .map(([k, v]) => `${k}:${v}@${ePrice(svcs.find((sv) => sv.id === k))}`).join(',');
    try {
      // لا تُستبدل العناصر إلا إذا تغيّرت فعلًا: تصحيح رقم جوال لا يصحّ أن
      // يعيد بناء خدمات الحجز.
      if (nowKey !== origKey) await admin.replaceItems(b.id, chosen.map((sv) => ({
        service_id: sv.id, service_name: sv.name, service_icon: sv.icon,
        price: ePrice(sv), duration_min: sv.duration_min,
        group_discount: sv.group_discount, deposit_amount: sv.deposit_amount || 0,
      })), Number(S.settings?.group_discount_amount || 0));
      await admin.update(b.id, {
        client_name: name, client_phone: phone, the_date: date,
        start_time: time.length === 5 ? `${time}:00` : time,
        loc_text: g('e-loc').value.trim() || null,
        loc_map: map || null,
        client_notes: g('e-notes').value.trim() || null,
      });
      await admin.log(b.id, 'edited');
      closeSheet(sheet); toast('حُفظ التعديل', 'ok'); reload();
    } catch (e) {
      btn.disabled = false; btn.textContent = 'حفظ التعديل';
      err.innerHTML = note(isOffline(e) ? NET_MSG : e.message);
    }
  };
}

function confirmThen(question, fn) {
  const content = document.getElementById('sheetContent');
  const prev = content.innerHTML;
  content.innerHTML = `
    <div class="arch mb">
      <div class="badge lg on-surface" data-icon="close" data-icon-size="24" style="margin:0 auto 10px"></div>
      <h2>${esc(question)}</h2>
      <p class="muted" style="margin-top:6px">يمكن التراجع لاحقًا من نفس الشاشة.</p>
    </div>
    <div class="btn-row">
      <button class="btn btn-ghost" id="c-no">تراجع</button>
      <button class="btn btn-danger" id="c-yes">نعم، متابعة</button>
    </div>`;
  hydrateIcons(content);
  document.getElementById('c-no').onclick = () => { content.innerHTML = prev; hydrateIcons(content); };
  document.getElementById('c-yes').onclick = fn;
}

/* ── إدخال عدّة حجوزات دفعةً واحدة ───────────────────────────────────
   ليست مناسبةً واحدة ولا مجموعةً مترابطة: قائمةُ عميلاتٍ تنتظر الإدخال،
   قد تختلف تواريخهنّ وأماكنهنّ وخدماتهنّ. كانت الورقة تُفتح وتُغلق لكلِّ
   واحدة — أربع دوراتٍ كاملة لأربع عميلات — والأسوأ أنّ الشبكة قد تنقطع
   بين الثانية والثالثة فيُحفَظ نصفُ القائمة ويضيع نصفُها بلا أثر.

   البطاقة هنا هي بطاقة الحجز الفردي بحقولها كلّها — بما فيها العربون —
   لكلِّ عميلة، تبدأ خاليةً كما لو فُتحت وحدها. والورقة لا تُغلَق بينهنّ،
   والحفظ نداءٌ ذرّيٌّ واحد: تتمّ القائمة كلُّها أو لا يُكتب منها شيء. */
function openGroupBooking() {
  const svcs = S.services.filter((s) => s.active);
  if (!svcs.length) return toast('أضيفي خدمة أولًا');

  const per = () => Number(S.settings?.group_discount_amount || 0);
  const idem = uuid();

  /* تبدأ خاليةً كأنّها ورقةٌ مستقلّة: العميلات لا يجمعهنّ شيء بالضرورة،
     ونسخُ عنوانِ سابقةٍ بلا طلبٍ يُخفي خطأً لا يُلحَظ حتى يصل السائق. */
  const fresh = () => ({
    nm: '', ph: '',
    qty: Object.fromEntries(svcs.map((sv) => [sv.id, 0])),
    price: {},
    date: today(), time: '16:00', loc: '', map: '',
    dep: 0, open: true,
  });

  const priceOf = (p, sv) => {
    const v = Number(p.price[sv.id]);
    return isFinite(v) && v >= 0 ? v : Number(sv.price);
  };
  const heads = (p) => svcs.reduce((n, sv) => n + p.qty[sv.id], 0);
  const mins  = (p) => svcs.reduce((n, sv) => n + sv.duration_min * p.qty[sv.id], 0);
  const gross = (p) => svcs.reduce((n, sv) => n + priceOf(p, sv) * p.qty[sv.id], 0);
  const disc  = (p) => {
    const g = svcs.reduce((n, sv) => n + (sv.group_discount ? p.qty[sv.id] : 0), 0);
    return (per() > 0 && g >= 2) ? Math.min(per() * g, gross(p)) : 0;
  };
  const net = (p) => Math.max(gross(p) - disc(p), 0);

  let people = [fresh()];

  showSheet('عدّة حجوزات', `
    <p class="muted mb">بطاقةٌ لكلِّ عميلة، بحقول الحجز المعتادة. أضيفيهنّ جميعًا ثمّ احفظي مرّةً واحدة.</p>
    <div id="g-list"></div>
    <button class="btn btn-ghost mb" id="g-add">${icon('plus', 18)} إضافة عميلة أخرى</button>
    <div class="card mb gsum" id="g-sum"></div>
    <div id="g-err"></div>
    <button class="btn btn-primary" id="g-save">حفظ</button>`);

  const g = (id) => document.getElementById(id);

  function card(p, i) {
    const t = net(p), n = heads(p), rest = Math.max(t - p.dep, 0), d = disc(p);
    if (!p.open) {
      return `<div class="pcard">
        <button class="phead" type="button" data-po="${i}">
          <span class="pnum">${int(i + 1)}</span>
          <span class="pw"><span class="pt">${esc(p.nm) || 'بلا اسم'}</span>
            <span class="ps">${n ? `${int(n)} خدمة · ` : ''}${fmtTime(p.time)}${
              p.dep ? ` · عربون ${money(p.dep)}` : ''}</span></span>
          <span class="pv">${n ? money(t) : '—'}</span>
        </button></div>`;
    }
    return `<div class="pcard open">
      <button class="phead" type="button" data-po="${i}">
        <span class="pnum">${int(i + 1)}</span>
        <span class="pw"><span class="pt">${esc(p.nm) || `العميلة ${int(i + 1)}`}</span>
          <span class="ps">اضغطي لطيّ البطاقة</span></span>
        <span class="pv">${n ? money(t) : '—'}</span>
      </button>
      <div class="pbody">
        <div class="field"><label class="label" for="gp-nm-${i}">اسم العميلة</label>
          <input class="input" id="gp-nm-${i}" data-gf="${i}:nm" value="${esc(p.nm)}"
                 placeholder="الاسم الكامل"></div>
        <div class="field"><label class="label" for="gp-ph-${i}">رقم الجوال</label>
          <input class="input ltr" id="gp-ph-${i}" data-gf="${i}:ph" type="tel"
                 inputmode="numeric" value="${esc(p.ph)}" placeholder="05xxxxxxxx"></div>

        <p class="label">الخدمات والأشخاص</p>
        <div class="list">
          ${svcs.map((sv) => `
            <div class="rowline">
              <span class="grow"><span class="t">${esc(sv.name)}</span>
                <span class="s">${money(sv.price)} ر.س · ${int(sv.duration_min)}د</span></span>
              <span class="stepper">
                <button type="button" data-gq="${i}:${esc(sv.id)}:-1" aria-label="إنقاص">−</button>
                <span class="val">${int(p.qty[sv.id])}</span>
                <button type="button" data-gq="${i}:${esc(sv.id)}:1" aria-label="زيادة">+</button>
              </span>
            </div>
            ${p.qty[sv.id] ? `
            <div class="priceline">
              <label class="label" for="gpp-${i}-${esc(sv.id)}">سعر خاص لكل شخص</label>
              <input class="input ltr" id="gpp-${i}-${esc(sv.id)}" type="number" min="0"
                     inputmode="numeric" data-gp="${i}:${esc(sv.id)}"
                     value="${priceOf(p, sv)}">
            </div>` : ''}`).join('')}
        </div>
        <div class="leader" style="margin-top:8px"><span class="k">الإجمالي</span>
          <span class="d"></span><span class="v">${n ? `${money(t)} ر.س` : '—'}</span></div>
        ${d ? `<p class="hint" style="color:var(--c-lost)">خصم المجموعة −${money(d)} ر.س</p>` : ''}
        <p class="hint">${n ? `${int(n)} شخص · ${fmtDuration(Math.max(mins(p), 15))} · ينتهي ${
          fmtTime(addMinutes(p.time, Math.max(mins(p), 15)).time)}`
          : 'اختاري خدمة واحدة على الأقل.'}</p>

        <div class="split mb" style="margin-top:10px">
          <div class="field" style="margin:0"><label class="label" for="gp-d-${i}">التاريخ</label>
            <input class="input" type="date" id="gp-d-${i}" data-gf="${i}:date" value="${p.date}"></div>
          <div class="field" style="margin:0"><label class="label" for="gp-t-${i}">الوقت</label>
            <input class="input" type="time" id="gp-t-${i}" data-gf="${i}:time" value="${p.time}"></div>
        </div>
        <div class="field"><label class="label" for="gp-l-${i}">الحي والمدينة <span class="opt">(اختياري)</span></label>
          <input class="input" id="gp-l-${i}" data-gf="${i}:loc" value="${esc(p.loc)}"></div>
        <div class="field"><label class="label" for="gp-m-${i}">رابط خرائط قوقل <span class="opt">(اختياري)</span></label>
          <input class="input ltr" id="gp-m-${i}" dir="ltr" data-gf="${i}:map" value="${esc(p.map)}"
                 placeholder="https://maps.app.goo.gl/..."></div>

        <div class="split mb">
          <div class="field" style="margin:0"><label class="label" for="gp-dep-${i}">العربون المستلَم</label>
            <input class="input ltr" id="gp-dep-${i}" type="number" min="0" step="50"
                   inputmode="numeric" data-gf="${i}:dep" value="${p.dep || ''}" placeholder="0"></div>
          <div class="field" style="margin:0"><label class="label">المتبقّي</label>
            <div class="input" id="gp-rest-${i}" style="display:flex;align-items:center">${
              n ? `${money(rest)} ر.س` : '—'}</div></div>
        </div>
        <div class="pfoot">
          ${i > 0 ? `<button class="rmp copy" type="button" data-gcp="${i}">${
            icon('copy', 14)} نسخ تاريخ وموقع السابقة</button>` : ''}
          ${people.length > 1 ? `<button class="rmp" type="button" data-grm="${i}">حذف هذه العميلة</button>` : ''}
        </div>
      </div></div>`;
  }

  function draw() {
    g('g-list').innerHTML = people.map((p, i) => card(p, i)).join('');
    const sum = people.reduce((a, p) => a + net(p), 0);
    const deps = people.reduce((a, p) => a + Number(p.dep || 0), 0);
    g('g-sum').innerHTML = `
      <div class="leader"><span class="k">عدد الحجوزات</span>
        <span class="d"></span><span class="v">${int(people.length)}</span></div>
      <div class="leader"><span class="k">مجموع المبالغ</span>
        <span class="d"></span><span class="v num">${money(sum)} ر.س</span></div>
      <div class="leader"><span class="k">مجموع العرابين</span>
        <span class="d"></span><span class="v num">${money(deps)} ر.س</span></div>
      <div class="leader"><span class="k">المتبقّي</span>
        <span class="d"></span><span class="v num">${money(Math.max(sum - deps, 0))} ر.س</span></div>`;
    g('g-save').textContent = people.length === 1
      ? 'حفظ الحجز' : `حفظ — يُنشئ ${int(people.length)} حجوزات`;
    wire();
  }

  function wire() {
    sheet.querySelectorAll('[data-po]').forEach((b) => b.onclick = () => {
      const i = Number(b.dataset.po);
      people.forEach((p, j) => { p.open = (j === i) ? !p.open : false; });
      draw();
    });
    sheet.querySelectorAll('[data-gq]').forEach((b) => b.onclick = () => {
      const [i, id, d] = b.dataset.gq.split(':');
      const p = people[Number(i)];
      p.qty[id] = Math.max(0, Math.min(12, p.qty[id] + Number(d)));
      draw();
    });
    sheet.querySelectorAll('[data-gp]').forEach((el) => el.oninput = () => {
      const [i, id] = el.dataset.gp.split(':');
      people[Number(i)].price[id] = Math.max(0, Number(el.value) || 0);
      liveTotals();
    });
    sheet.querySelectorAll('[data-gf]').forEach((el) => el.oninput = () => {
      const [i, k] = el.dataset.gf.split(':');
      people[Number(i)][k] = (k === 'dep') ? Math.max(0, Number(el.value) || 0) : el.value;
      liveTotals();
    });
    sheet.querySelectorAll('[data-gcp]').forEach((b) => b.onclick = () => {
      const i = Number(b.dataset.gcp), prev = people[i - 1];
      Object.assign(people[i], { date: prev.date, time: prev.time, loc: prev.loc, map: prev.map });
      draw();
      toast('نُسخ تاريخ وموقع السابقة', 'ok');
    });
    sheet.querySelectorAll('[data-grm]').forEach((b) => b.onclick = () => {
      people.splice(Number(b.dataset.grm), 1);
      if (!people.some((p) => p.open)) people[people.length - 1].open = true;
      draw();
    });
  }

  /* الكتابة لا تُعيد رسم البطاقة — وإلّا قفز مؤشّر الكتابة إلى آخر الحقل.
     فتُحدَّث الأرقام وحدها في مكانها: متبقّي البطاقة، ومجاميع الورقة. */
  function liveTotals() {
    people.forEach((p, i) => {
      const n = heads(p);
      const rest = g(`gp-rest-${i}`);
      if (rest) rest.textContent = n ? `${money(Math.max(net(p) - p.dep, 0))} ر.س` : '—';
      const head = sheet.querySelector(`[data-po="${i}"] .pv`);
      if (head) head.textContent = n ? money(net(p)) : '—';
    });
    const sum = people.reduce((a, p) => a + net(p), 0);
    const deps = people.reduce((a, p) => a + Number(p.dep || 0), 0);
    const v = g('g-sum').querySelectorAll('.v');
    if (v.length === 4) {
      v[1].textContent = `${money(sum)} ر.س`;
      v[2].textContent = `${money(deps)} ر.س`;
      v[3].textContent = `${money(Math.max(sum - deps, 0))} ر.س`;
    }
  }

  g('g-add').onclick = () => {
    people.forEach((p) => { p.open = false; });
    people.push(fresh());
    draw();
    sheet.querySelector('.sheet-body')?.scrollTo({
      top: sheet.querySelector('.sheet-body').scrollHeight, behavior: 'smooth' });
  };

  g('g-save').onclick = async () => {
    const err = g('g-err');
    for (let i = 0; i < people.length; i += 1) {
      const p = people[i];
      const who = `العميلة ${int(i + 1)}`;
      if (p.nm.trim().length < 2) { return fail(i, `${who}: اكتبي الاسم.`); }
      if (!normalisePhone(p.ph)) { return fail(i, `${who}: رقم الجوال غير صحيح.`); }
      if (!p.date || !p.time) { return fail(i, `${who}: اختاري التاريخ والوقت.`); }
      if (!heads(p)) { return fail(i, `${who}: اختاري خدمة واحدة على الأقل.`); }
      if (p.map && !/^https:\/\/\S+$/i.test(p.map)) {
        return fail(i, `${who}: رابط الخريطة يجب أن يبدأ بـ https://`);
      }
    }
    function fail(i, msg) {
      people.forEach((p, j) => { p.open = (j === i); });
      draw();
      err.innerHTML = note(msg);
      err.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }
    err.innerHTML = '';
    const btn = g('g-save'); btn.disabled = true; btn.textContent = 'جارٍ الحفظ…';
    try {
      const payload = people.map((p) => ({
        client_name: p.nm.trim(),
        client_phone: normalisePhone(p.ph),
        the_date: p.date, start_time: p.time,
        duration_min: Math.max(mins(p), 15),
        status: 'confirmed',
        loc_text: p.loc.trim() || null,
        loc_map: p.map.trim() || null,
        discount_per_person: per(),
        deposit: Math.max(0, Number(p.dep) || 0),
        confirmed_at: new Date().toISOString(),
        items: svcs.flatMap((sv) => Array.from({ length: p.qty[sv.id] }, () => ({
          service_id: sv.id, service_name: sv.name, service_icon: sv.icon,
          price: priceOf(p, sv), duration_min: sv.duration_min,
          group_discount: sv.group_discount, deposit_amount: sv.deposit_amount || 0,
        }))),
      }));
      const rows = await admin.createGroup(payload, null, idem);
      closeSheet(sheet);
      toast(rows.length === 1 ? 'حُفظ الحجز' : `حُفظت ${int(rows.length)} حجوزات`, 'ok');
      reload();
    } catch (e) {
      btn.disabled = false;
      btn.textContent = people.length === 1 ? 'حفظ الحجز' : `حفظ — يُنشئ ${int(people.length)} حجوزات`;
      err.innerHTML = note(isOffline(e) ? NET_MSG : e.message);
    }
  };

  draw();
}

/* ── Manual booking (walk-in / phone) ─────────────────────────────────── */

function openNewBooking() {
  const svcs = S.services.filter((s) => s.active);
  if (!svcs.length) return toast('أضيفي خدمة أولًا');

  showSheet('حجز يدوي', `
    <div class="field"><label class="label" for="n-name">اسم العميلة</label>
      <input class="input" id="n-name" placeholder="الاسم الكامل"></div>
    <div class="field"><label class="label" for="n-phone">رقم الجوال</label>
      <input class="input ltr" id="n-phone" type="tel" inputmode="numeric" placeholder="05xxxxxxxx"></div>
    <div class="card mb">
      <p class="label">الخدمات والأشخاص</p>
      <div class="list">
        ${svcs.map((sv) => `
          <div class="rowline">
            <span class="grow"><span class="t">${esc(sv.name)}</span>
              <span class="s">${money(sv.price)} ر.س · ${int(sv.duration_min)}د</span></span>
            <span class="stepper">
              <button type="button" data-nd="-" data-sid="${esc(sv.id)}" aria-label="إنقاص">−</button>
              <span class="val" data-nv="${esc(sv.id)}">0</span>
              <button type="button" data-nd="+" data-sid="${esc(sv.id)}" aria-label="زيادة">+</button>
            </span>
          </div>
          <div class="priceline" data-np="${esc(sv.id)}" hidden>
            <label class="label" for="np-${esc(sv.id)}">سعر خاص لكل شخص</label>
            <input class="input ltr" id="np-${esc(sv.id)}" data-nprice="${esc(sv.id)}"
                   type="number" min="0" inputmode="numeric" value="${Number(sv.price)}">
          </div>`).join('')}
      </div>
      <div class="leader" style="margin-top:8px"><span class="k">الإجمالي</span>
        <span class="d"></span><span class="v" id="n-sum">—</span></div>
      <p class="hint" id="n-disc" hidden style="color:var(--rose)"></p>
      <p class="hint" id="n-dur">اختاري خدمة واحدة على الأقل.</p>
    </div>
    <div class="card mb">
      <div class="field" style="margin:0">
        <label class="label" for="n-dep">العربون المستلَم <span class="opt">(اختياري)</span></label>
        <input class="input ltr" id="n-dep" type="number" min="0" step="50"
               inputmode="numeric" placeholder="0" value="">
      </div>
      <div class="leader" style="margin-top:10px"><span class="k">المتبقّي</span>
        <span class="d"></span><span class="v" id="n-rest">—</span></div>
      <p class="hint" id="n-dephint">اتركيه فارغًا إن لم تُحوِّل شيئًا بعد.</p>
    </div>
    <div class="split mb">
      <div class="field" style="margin:0"><label class="label" for="n-date">التاريخ</label>
        <input class="input" type="date" id="n-date" value="${today()}"></div>
      <div class="field" style="margin:0"><label class="label" for="n-time">الوقت</label>
        <input class="input" type="time" id="n-time" value="16:00"></div>
    </div>
    <div class="field"><label class="label" for="n-loc">الحي والمدينة <span class="opt">(اختياري)</span></label>
      <input class="input" id="n-loc"></div>
    <div class="field"><label class="label" for="n-map">رابط خرائط قوقل <span class="opt">(اختياري)</span></label>
      <input class="input ltr" id="n-map" dir="ltr" placeholder="https://maps.app.goo.gl/...">
      <p class="hint">بدونه لا يمكن إرسال الموقع للسائق.</p></div>
    <div class="note mb">${icon('clock', 18)}
      <span>الحجز اليدوي يُحفظ مؤكّدًا مباشرة ولا يمرّ بفحص الأوقات المتاحة — راجعي الأجندة بعده.</span></div>
    <div id="n-err"></div>
    <button class="btn btn-primary" id="n-save">حفظ الحجز</button>`);

  const gn = (id) => document.getElementById(id);
  const nCounts = () => Object.fromEntries(svcs.map((sv) =>
    [sv.id, Number(document.querySelector(`[data-nv="${CSS.escape(sv.id)}"]`).textContent) || 0]));
  // السعر المكتوب يعلو على سعر القائمة — أحيانًا تعطي زوجتك سعرًا خاصًا.
  const nPrice = (sv) => {
    const el = document.querySelector(`[data-nprice="${CSS.escape(sv.id)}"]`);
    const v = Number(el?.value);
    return isFinite(v) && v >= 0 ? v : Number(sv.price);
  };
  function nRecompute() {
    const c = nCounts();
    let total = 0, dur = 0, n = 0, grp = 0;
    svcs.forEach((sv) => {
      const q = c[sv.id];
      total += nPrice(sv) * q; dur += sv.duration_min * q; n += q;
      if (sv.group_discount) grp += q;
      const box = document.querySelector(`[data-np="${CSS.escape(sv.id)}"]`);
      if (box) box.hidden = q === 0;
    });
    // نفس قاعدة صفحة العميلة: من شخصين فأكثر على الخدمات المؤهَّلة.
    const per = Number(S.settings?.group_discount_amount || 0);
    const disc = (per > 0 && grp >= 2) ? Math.min(per * grp, total) : 0;
    gn('n-sum').textContent = n ? `${money(total - disc)} ر.س` : '—';
    const dline = gn('n-disc');
    dline.hidden = !disc;
    if (disc) dline.textContent = `خصم المجموعة (${int(grp)} أشخاص) −${money(disc)} ر.س`;
    const t = gn('n-time').value;
    const ends = (n && t) ? ` · ينتهي ${fmtTime(addMinutes(t, dur).time)}` : '';
    gn('n-dur').textContent = n
      ? `${int(n)} شخص · ${fmtDuration(Math.max(dur, 15))}${ends}`
      : 'اختاري خدمة واحدة على الأقل.';
    nRest(total - disc);
  }

  /* العربون المستلَم: ما دفعته العميلة قبل الموعد. القاعدة تقصّه إلى
     السعر إن زاد، لكنّ الأصدق أن تراه هنا قبل الحفظ لا بعده. */
  function nRest(due) {
    const dep = Math.max(0, Number(gn('n-dep').value) || 0);
    const over = dep > due && due > 0;
    const rest = Math.max(due - dep, 0);
    gn('n-rest').textContent = due > 0 ? `${money(rest)} ر.س` : '—';
    gn('n-dephint').textContent = !due ? 'اتركيه فارغًا إن لم تُحوِّل شيئًا بعد.'
      : over ? `العربون أكبر من الإجمالي — سيُحفظ ${money(due)} ر.س.`
      : !dep ? 'اتركيه فارغًا إن لم تُحوِّل شيئًا بعد.'
      : rest ? 'يُذكر المتبقّي في رسالة التأكيد.'
             : 'مُسدَّد بالكامل.';
    gn('n-dephint').style.color = over ? 'var(--c-open)' : '';
  }
  document.querySelectorAll('[data-nprice]').forEach((el) => el.oninput = nRecompute);
  document.querySelectorAll('[data-nd]').forEach((btn) => btn.onclick = () => {
    const cell = document.querySelector(`[data-nv="${CSS.escape(btn.dataset.sid)}"]`);
    const next = Math.max(0, Math.min(12, Number(cell.textContent) + (btn.dataset.nd === '+' ? 1 : -1)));
    cell.textContent = String(next); nRecompute();
  });
  gn('n-time').onchange = nRecompute;
  gn('n-dep').oninput = nRecompute;
  nRecompute();

  // يُولَّد مرّة لهذه الورقة: ضغطةٌ ثانية بعد انقطاع تحمل المفتاح نفسه.
  const idem = uuid();
  gn('n-save').onclick = async () => {
    const err = gn('n-err');
    const name = gn('n-name').value.trim();
    const phone = normalisePhone(gn('n-phone').value);
    const date = gn('n-date').value;
    const time = gn('n-time').value;
    const c = nCounts();
    const chosen = svcs.flatMap((sv) => Array.from({ length: c[sv.id] }, () => sv));
    const map = gn('n-map').value.trim();
    if (name.length < 2) { err.innerHTML = note('اكتبي اسم العميلة.'); return; }
    if (!phone) { err.innerHTML = note('رقم الجوال غير صحيح.'); return; }
    if (!date || !time) { err.innerHTML = note('اختاري التاريخ والوقت.'); return; }
    if (!chosen.length) { err.innerHTML = note('اختاري خدمة واحدة على الأقل.'); return; }
    if (map && !/^https:\/\/\S+$/i.test(map)) { err.innerHTML = note('رابط الخريطة يجب أن يبدأ بـ https://'); return; }
    err.innerHTML = '';
    const btn = gn('n-save'); btn.disabled = true; btn.textContent = 'جارٍ الحفظ…';
    try {
      const dur = chosen.reduce((n2, sv) => n2 + sv.duration_min, 0);
      await admin.createBooking({
        client_name: name, client_phone: phone, the_date: date, start_time: time,
        duration_min: Math.max(dur, 15), status: 'confirmed',
        loc_text: gn('n-loc').value.trim() || null,
        loc_map: map || null,
        // بدونه يبقى صفرًا فلا يُطبَّق خصم المجموعة على الحجز اليدوي.
        discount_per_person: Number(S.settings?.group_discount_amount || 0),
        deposit: Math.max(0, Number(gn('n-dep').value) || 0),
        confirmed_at: new Date().toISOString(),
      }, chosen.map((sv) => ({
        service_id: sv.id, service_name: sv.name, service_icon: sv.icon,
        price: nPrice(sv), duration_min: sv.duration_min,
        group_discount: sv.group_discount, deposit_amount: sv.deposit_amount || 0,
      })), idem);
      closeSheet(sheet); toast('حُفظ الحجز', 'ok'); reload();
    } catch (e) {
      btn.disabled = false; btn.textContent = 'حفظ الحجز';
      err.innerHTML = note(isOffline(e) ? NET_MSG : e.message);
    }
  };
}
</script>
