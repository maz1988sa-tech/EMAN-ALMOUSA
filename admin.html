<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>لوحة التحكم — إيمان آل موسى</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#2b1c16">
<link rel="manifest" href="manifest-admin.webmanifest">
<link rel="icon" href="assets/favicon-admin.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/fonts.css?v=24">
<link rel="stylesheet" href="assets/theme.css?v=24">
<style>
  .appbar { position: sticky; top: 0; z-index: 40; background: var(--surface);
            border-bottom: 1px solid var(--line); }
  .appbar .row { display: flex; align-items: center; justify-content: space-between;
                 gap: 10px; padding: 12px 16px 10px; max-width: var(--page); margin: 0 auto; }
  .appbar .brand { display: flex; align-items: center; gap: 11px; min-width: 0; }
  .appbar .brandmark { height: 30px; width: auto; display: block; flex: 0 0 auto; }
  .appbar .sub { display: block; font: 500 9px/1 var(--fd); direction: ltr;
                 letter-spacing: .3em; color: var(--rose); text-transform: uppercase;
                 padding-inline-start: 11px; border-inline-start: 1px solid var(--line-2); }
  .tabs { display: flex; gap: 4px; overflow-x: auto; padding: 0 16px 10px;
          max-width: var(--page); margin: 0 auto; scrollbar-width: none; }
  .tabs::-webkit-scrollbar { display: none; }
  /* التبويب يُعلَّم بخطّ تحته كما تُعلَّم فصول صفحة العميلة، لا بحبّة ممتلئة. */
  .tab { flex: 0 0 auto; display: flex; align-items: center; gap: 6px; border: 0;
         background: transparent; color: var(--ink-3); font-family: var(--ft);
         font-size: 13.5px; font-weight: 500; padding: 8px 12px 9px; min-height: 38px;
         border-bottom: 2px solid transparent; cursor: pointer;
         transition: color .2s ease, border-color .2s ease; }
  .tab[aria-current="page"] { color: var(--ink); font-weight: 500;
                              border-bottom-color: var(--rose); }
  .tab .dot { background: var(--danger); color: #FFF; border-radius: 999px;
              font-size: 10.5px; font-weight: 700; padding: 1px 6px; min-width: 18px; }

  /* شريط أقسام الإعدادات: أخفّ من التبويبات الرئيسية لأنه مستوى أدنى. */
  .panebar { display: flex; gap: 6px; margin: 16px 0 2px; padding: 4px;
             background: var(--surface-2); border: 1px solid var(--line); }
  .panetab { flex: 1; border: 0; background: transparent; color: var(--ink-2);
             font-family: var(--ft); font-size: 13px; font-weight: 500;
             padding: 9px 8px; min-height: 40px; border-radius: var(--r-sm);
             cursor: pointer; transition: background .18s, color .18s; }
  .panetab[aria-current="true"] { background: var(--surface); color: var(--ink);
                                  font-weight: 500; border: 1px solid var(--line-2); }

  .bk { background: rgba(255,255,255,.66); border: 1px solid var(--line);
        border-radius: var(--r-lg);
        padding: 14px 15px; position: relative; overflow: hidden;
        width: 100%; text-align: start; font-family: var(--ft); color: var(--ink); cursor: pointer; }
  .bk::before { content: ""; position: absolute; inset-block: 0; inset-inline-start: 0;
                width: 3px; background: var(--line-2); }
  .bk.s-pending::before   { background: var(--warn); }
  .bk.s-confirmed::before { background: var(--rose); }
  .bk.s-done::before      { background: var(--ok); }
  .bk.s-cancelled::before, .bk.s-rejected::before, .bk.s-no_show::before { background: var(--danger); }
  .bk .head { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
  .bk .who { flex: 1; min-width: 0; }
  .bk .nm { display: block; font-family: var(--fd); font-weight: 700; font-size: 15.5px;
            line-height: 1.35; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bk .when { display: block; font-size: 12px; color: var(--ink-3); unicode-bidi: isolate; }
  .bk .chips { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 9px;
               padding-top: 9px; border-top: 1px solid var(--line); }
  .bk.dim { opacity: .62; }

  .acts { display: flex; gap: 6px; flex-shrink: 0; }
  .acts .iconbtn { width: 38px; height: 38px; }

  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; }
  .stat .l { display: block; font-size: 11.5px; color: var(--ink-3); line-height: 1.5; }
  .stat .v { display: block; font-family: var(--fd); font-size: 24px; font-weight: 700;
             line-height: 1.25; font-variant-numeric: tabular-nums; }
  .stat .s { display: block; font-size: 11px; color: var(--rose-deep); line-height: 1.5;
             unicode-bidi: isolate; }

  .list { display: grid; gap: 9px; }
  .rowline { display: flex; align-items: center; gap: 10px; padding: 12px 0;
             border-bottom: 1px solid var(--line); }
  .rowline:last-child { border-bottom: 0; }
  .rowline .grow { flex: 1; min-width: 0; }
  .rowline .t { display: block; font-weight: 700; font-size: 14.5px; }
  .rowline .s { display: block; font-size: 12px; color: var(--ink-3); unicode-bidi: isolate; }

  .tl { position: relative; padding-inline-start: 18px; }
  .tl::before { content: ""; position: absolute; inset-block: 6px; inset-inline-start: 4px;
                width: 1px; background: var(--line-2); }
  .tl .stop { position: relative; padding: 9px 0; }
  .tl .stop::before { content: ""; position: absolute; inset-inline-start: -18px; top: 16px;
                      width: 9px; height: 9px; border-radius: 50%; background: var(--rose);
                      box-shadow: 0 0 0 3px var(--cream); }
  .tl .gap { font-size: 11.5px; color: var(--ink-3); padding-inline-start: 2px; }

  .login { max-width: 380px; margin: 8vh auto 0; }
  .hide { display: none !important; }
  .mt { margin-top: 16px; }
  .mb { margin-bottom: 16px; }
  .center { text-align: center; }
  .muted { color: var(--ink-3); font-size: 13px; }
  .split { display: flex; gap: 8px; align-items: flex-end; }
  .split > * { flex: 1; }
</style>
</head>
<body>

<div id="gate">
  <main class="shell login">
    <div class="arch" style="margin-top:6vh">
      <div class="badge lg on-surface" data-icon="sparkle" data-icon-size="26" style="margin:0 auto 12px"></div>
      <h1>لوحة التحكم</h1>
      <p class="muted" style="margin-top:4px">إيمان آل موسى</p>
    </div>
    <form class="card mt" id="loginForm">
      <div class="field">
        <label class="label" for="email">البريد الإلكتروني</label>
        <input class="input ltr" id="email" type="email" autocomplete="username" required>
      </div>
      <div class="field">
        <label class="label" for="pass">كلمة المرور</label>
        <input class="input ltr" id="pass" type="password" autocomplete="current-password" required>
      </div>
      <div id="loginErr" role="alert"></div>
      <button class="btn btn-primary" type="submit" id="loginBtn">دخول</button>
    </form>
  </main>
</div>

<div id="app" class="hide">
  <header class="appbar">
    <div class="row">
      <div class="brand">
        <img class="brandmark" src="assets/brand/logo_dark.png"
             alt="EMAN AAL MOUSA" id="bizName">
        <span class="sub">لوحة التحكم</span>
      </div>
      <div class="acts">
        <button class="iconbtn" id="btnRefresh" aria-label="تحديث" data-icon="export"></button>
        <button class="iconbtn" id="btnSignOut" aria-label="خروج" data-icon="back"></button>
      </div>
    </div>
    <nav class="tabs" id="tabs" aria-label="أقسام اللوحة"></nav>
  </header>

  <main class="shell" id="view">
    <div class="list mt"><div class="skeleton"></div><div class="skeleton"></div></div>
  </main>
</div>

<div class="sheet" id="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
  <div class="sheet-body">
    <div class="sheet-head">
      <h2 id="sheetTitle">تفاصيل</h2>
      <button class="iconbtn" id="sheetClose" aria-label="إغلاق" data-icon="close"></button>
    </div>
    <div class="sheet-content" id="sheetContent"></div>
  </div>
</div>

<script src="assets/vendor/supabase.js"></script>
<script src="assets/config.js"></script>
<script type="module">
import { icon, hydrateIcons } from './assets/icons.js?v=24';
import {
  sb, admin, templates, WEEKDAYS,
  fmtDate, fmtDateRelative, fmtTime, fmtDuration, riyal, money, int, esc,
  today, addDays, parseDate, weekday, addMinutes, prettyPhone, telHref, waHref,
  normalisePhone, statusLabel, STATUS, toast, openSheet, closeSheet, download, toCSV,
  receiptUrl, purgeOrphanReceipts,
} from './assets/db.js?v=24';

const view = document.getElementById('view');
const sheet = document.getElementById('sheet');

const TABS = [
  { id: 'home',     label: 'الرئيسية',  icon: 'home' },
  { id: 'agenda',   label: 'الأجندة',   icon: 'calendar' },
  { id: 'browse',   label: 'الحجوزات',  icon: 'search' },
  { id: 'dues',     label: 'المستحقات', icon: 'riyal' },
  { id: 'settings', label: 'الإعدادات', icon: 'gear' },
];

/* شرائح تبويب الحجوزات. «القادمة» أوّلها لأنها ما تُفتح اللوحة لأجله،
   و«الكل» آخرها لأنها بحث لا تصفّح. */
const STATUS_FILTERS = [
  { id: 'upcoming',  label: 'القادمة',  test: (b) => b.the_date >= today() && ['pending','confirmed'].includes(b.status) },
  { id: 'pending',   label: 'معلّقة',   test: (b) => b.status === 'pending' },
  { id: 'confirmed', label: 'مؤكّدة',   test: (b) => b.status === 'confirmed' },
  { id: 'done',      label: 'مكتملة',   test: (b) => b.status === 'done' },
  { id: 'off',       label: 'ملغاة',    test: (b) => ['cancelled','rejected','no_show'].includes(b.status) },
  { id: 'all',       label: 'الكل',     test: () => true },
];
const PERIOD_FILTERS = [
  { id: 'all',   label: 'كل الفترات' },
  { id: 'week',  label: 'هذا الأسبوع' },
  { id: 'month', label: 'هذا الشهر' },
  { id: 'range', label: 'نطاق تاريخ' },
];

// أوقات العمل والخدمات والإعدادات صارت أقسامًا تحت تبويب واحد: كلها
// ضبطٌ يُفتح مرة كل حين، لا شاشات عمل يومي.
const SETTING_PANES = [
  { id: 'general',  label: 'عام',        icon: 'gear' },
  { id: 'hours',    label: 'أوقات العمل', icon: 'clock' },
  { id: 'services', label: 'الخدمات',     icon: 'lipstick' },
];

const S = {
  tab: 'home',
  settingsPane: 'general',
  settings: null,
  services: [],
  bookings: [],
  rules: [],
  overrides: [],
  agendaDate: today(),
  calMonth: today().slice(0, 7),
  q: '',
  fStatus: 'upcoming',
  fPeriod: 'all',
  fFrom: '',
  fTo: '',
  unsubscribe: null,
};

/* ── تصفية الحجوزات ─────────────────────────────────────────────────────
   التصفية تجري على ما هو محمَّل في الذاكرة لا بطلب جديد: النافذة المحمَّلة
   ١٢٠ يومًا للخلف وما بعدها، والنتيجة فورية بلا انتظار شبكة. */
function periodBounds() {
  const t = today();
  if (S.fPeriod === 'week')  return [t, addDays(t, 7)];
  if (S.fPeriod === 'month') return [t.slice(0, 8) + '01', addDays(t.slice(0, 8) + '01', 31)];
  if (S.fPeriod === 'range') return [S.fFrom || null, S.fTo || null];
  return [null, null];
}
function matchesQuery(b, q) {
  if (!q) return true;
  const digits = q.replace(/[^0-9٠-٩۰-۹]/g, '');
  if (digits.length >= 3) {
    const norm = normalisePhone(digits) || digits;
    return String(b.client_phone || '').includes(norm.replace(/^966/, ''))
        || String(b.client_phone || '').includes(norm)
        || String(b.ref || '').includes(digits);
  }
  const needle = q.trim().toLowerCase();
  return String(b.client_name || '').toLowerCase().includes(needle)
      || String(b.ref || '').toLowerCase().includes(needle);
}
function filtered() {
  const f = STATUS_FILTERS.find((x) => x.id === S.fStatus) || STATUS_FILTERS[0];
  const [from, to] = periodBounds();
  return S.bookings
    .filter((b) => f.test(b))
    .filter((b) => (!from || b.the_date >= from) && (!to || b.the_date <= to))
    .filter((b) => matchesQuery(b, S.q))
    .sort((a, b) => (b.the_date + b.start_time).localeCompare(a.the_date + a.start_time));
}

const pendingCount = () => S.bookings.filter((b) => b.status === 'pending').length;

/* ── Auth gate ────────────────────────────────────────────────────────── */

document.getElementById('loginForm').onsubmit = async (e) => {
  e.preventDefault();
  const btn = document.getElementById('loginBtn');
  const box = document.getElementById('loginErr');
  btn.disabled = true; btn.textContent = 'جارٍ الدخول...';
  box.innerHTML = '';
  try {
    await admin.signIn(document.getElementById('email').value.trim(),
                       document.getElementById('pass').value);
    await start();
  } catch (err) {
    box.innerHTML = `<div class="note danger mb">${icon('close', 18)}<span>${
      /Invalid login/i.test(err.message || '') ? 'البريد أو كلمة المرور غير صحيحة.' : esc(err.message)
    }</span></div>`;
  } finally {
    btn.disabled = false; btn.textContent = 'دخول';
  }
};

document.getElementById('btnSignOut').onclick = async () => {
  S.unsubscribe?.();
  await admin.signOut();
  location.reload();
};
document.getElementById('btnRefresh').onclick = () => reload(true);
document.getElementById('sheetClose').onclick = () => closeSheet(sheet);

(async function boot() {
  hydrateIcons(document);
  if (await admin.session()) start();
})();

async function start() {
  document.getElementById('gate').classList.add('hide');
  document.getElementById('app').classList.remove('hide');
  renderTabs();
  await reload();

  // A request that lands while the dashboard is open should announce itself.
  S.unsubscribe = admin.onBookingChange(async (payload) => {
    await reload();
    if (payload.eventType === 'INSERT' && payload.new?.status === 'pending') {
      toast(`طلب حجز جديد من ${payload.new.client_name}`, 'ok');
      notify(payload.new);
    }
  });

  if ('Notification' in window && Notification.permission === 'default') {
    setTimeout(() => Notification.requestPermission().catch(() => {}), 4000);
  }
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
}

function notify(b) {
  if (!('Notification' in window) || Notification.permission !== 'granted') return;
  try {
    new Notification('طلب حجز جديد', {
      body: `${b.client_name} — ${fmtDate(b.the_date, { short: true })} ${fmtTime(b.start_time)}`,
      icon: 'assets/icon-192.svg', tag: `bk-${b.id}`,
    });
  } catch { /* notifications unavailable in this context */ }
}

async function reload(announce = false) {
  try {
    const [settings, services, bookings, rules, overrides] = await Promise.all([
      admin.settings(), admin.services(),
      admin.bookings({ from: addDays(today(), -120) }),
      admin.rules(), admin.overrides(addDays(today(), -30), addDays(today(), 180)),
    ]);
    Object.assign(S, { settings, services, bookings, rules, overrides });
    if (settings?.business_name) document.getElementById('bizName').alt = settings.business_name;
    renderTabs();
    render();
    if (announce) toast('تم التحديث', 'ok');

    // الرفع يسبق الحجز، فمن تركت الصفحة بعد الرفع تخلّف ملفًا بلا حجز.
    // يُنظَّف مرة واحدة عند فتح اللوحة، بصمت: التنظيف ليس مهمة صاحبته.
    if (!reload._purged) {
      reload._purged = true;
      purgeOrphanReceipts().catch(() => { /* ليس سببًا لتعطيل اللوحة */ });
    }
  } catch (err) {
    console.error(err);
    view.innerHTML = `<div class="note danger mt">${icon('close', 18)}
      <span>تعذّر تحميل البيانات: ${esc(err.message || '')}</span></div>`;
  }
}

/* ── Chrome ───────────────────────────────────────────────────────────── */

function renderTabs() {
  const host = document.getElementById('tabs');
  const n = pendingCount();
  host.innerHTML = TABS.map((t) => `
    <button class="tab" data-tab="${t.id}" ${S.tab === t.id ? 'aria-current="page"' : ''}>
      ${icon(t.icon, 17)} ${t.label}
      ${t.id === 'home' && n ? `<span class="dot num">${int(n)}</span>` : ''}
    </button>`).join('');
  host.querySelectorAll('[data-tab]').forEach((b) => b.onclick = () => {
    S.tab = b.dataset.tab; renderTabs(); render(); window.scrollTo({ top: 0 });
  });
}

function render() {
  ({ home: renderHome, agenda: renderAgenda, browse: renderBrowse, dues: renderDues,
     settings: renderSettingsTab }[S.tab] || renderHome)();
  hydrateIcons(view);
}

/* القسم الفرعي يكتب `view` كاملًا كما كان يفعل حين كان تبويبًا مستقلًا،
   ثم يُدسّ شريط الأقسام فوقه — الإدراج في المقدّمة لا يمسّ العناصر
   الموجودة ولا مستمعاتها. */
function renderSettingsTab() {
  const pane = SETTING_PANES.find((p) => p.id === S.settingsPane) || SETTING_PANES[0];
  ({ general: renderSettings, hours: renderHours, services: renderServices }[pane.id])();

  view.insertAdjacentHTML('afterbegin', `
    <div class="panebar">
      ${SETTING_PANES.map((p) => `
        <button class="panetab" data-pane="${p.id}"
                ${p.id === pane.id ? 'aria-current="true"' : ''}>${esc(p.label)}</button>`).join('')}
    </div>`);

  view.querySelectorAll('[data-pane]').forEach((b) => b.onclick = () => {
    S.settingsPane = b.dataset.pane;
    render(); hydrateIcons(view); window.scrollTo({ top: 0 });
  });
}

/* ── Booking card ─────────────────────────────────────────────────────── */

function bookingCard(b, { showDate = true } = {}) {
  const items = b.booking_items || [];
  const due = Number(b.price) - Number(b.deposit);
  const lead = items[0] || {};
  const dim = ['cancelled', 'rejected', 'no_show'].includes(b.status);
  const end = addMinutes(b.start_time, b.duration_min).time;

  return `
    <button class="bk s-${esc(b.status)} ${dim ? 'dim' : ''}" data-open="${b.id}">
      <span class="head">
        <span class="badge" data-icon="${esc(lead.service_icon || 'sparkle')}" data-icon-size="19"></span>
        <span class="who">
          <span class="nm">${esc(b.client_name)}</span>
          <span class="when">${showDate ? `${fmtDateRelative(b.the_date)} · ` : ''}${fmtTime(b.start_time)} — ${fmtTime(end)}</span>
        </span>
      </span>
      <span class="leader"><span class="k">الإجمالي</span><span class="d"></span>
        <span class="v">${riyal(b.price)}</span></span>
      ${Number(b.deposit) > 0 || due > 0 ? `
        <span class="leader"><span class="k">${due > 0 ? 'المتبقي' : 'مسدّد'}</span><span class="d"></span>
          <span class="v ${due > 0 ? 'due' : 'paid'}">${due > 0 ? riyal(due) : riyal(b.price)}</span></span>` : ''}
      <span class="chips">
        <span class="pill ${esc(b.status)}">${esc(statusLabel(b.status))}</span>
        ${items.length > 1 ? `<span class="pill">${icon('users', 13)} ${int(items.length)}</span>` : ''}
        <span class="pill quiet">${fmtDuration(b.duration_min)}</span>
        ${b.cancel_requested && ['pending', 'confirmed'].includes(b.status)
          ? '<span class="pill cancelled">طلبت الإلغاء</span>' : ''}
        ${b.source === 'client' ? '<span class="pill quiet">من العميلة</span>' : ''}
      </span>
    </button>`;
}

function bindCards(root = view) {
  root.querySelectorAll('[data-open]').forEach((el) =>
    el.onclick = () => openBooking(el.dataset.open));
}

/* ── Home ─────────────────────────────────────────────────────────────── */

function renderHome() {
  const t = today();
  const pending  = S.bookings.filter((b) => b.status === 'pending')
                             .sort((a, b) => (a.the_date + a.start_time).localeCompare(b.the_date + b.start_time));
  const todays   = S.bookings.filter((b) => b.the_date === t && !['cancelled', 'rejected'].includes(b.status));
  const upcoming = S.bookings.filter((b) => b.the_date > t && b.status === 'confirmed').slice(0, 6);

  const month = t.slice(0, 7);
  const mine = S.bookings.filter((b) => b.the_date.startsWith(month) && !['cancelled', 'rejected'].includes(b.status));
  const collected = S.bookings.filter((b) => !['cancelled', 'rejected'].includes(b.status))
                              .reduce((n, b) => n + Number(b.deposit), 0);
  const outstanding = S.bookings.filter((b) => ['confirmed', 'done'].includes(b.status))
                                .reduce((n, b) => n + (Number(b.price) - Number(b.deposit)), 0);

  view.innerHTML = `
    ${pending.length ? `
      <div class="sec-head" style="margin-top:18px">
        <h2>طلبات بانتظارك</h2><span class="rule"></span>
        <span class="count">${int(pending.length)}</span>
      </div>
      <div class="list">${pending.map((b) => bookingCard(b)).join('')}</div>` : `
      <div class="arch" style="margin-top:18px">
        <div class="badge lg on-surface" data-icon="check" data-icon-size="24" style="margin:0 auto 10px"></div>
        <h2>لا طلبات معلّقة</h2>
        <p class="muted" style="margin-top:4px">كل شيء تحت السيطرة.</p>
      </div>`}

    <div class="sec-head"><h2>اليوم</h2><span class="rule"></span>
      <span class="count">${fmtDate(t, { withDow: true, short: true })}</span></div>
    ${todays.length
      ? `<div class="list">${todays.map((b) => bookingCard(b, { showDate: false })).join('')}</div>
         ${todays.length > 1 || S.settings?.driver_phone ? `

/* تقرير الدخل: المتوقّع هو ما حُجز، والفعلي ما اكتمل، والضائع ما أُلغي.
   الثلاثة معًا لأن رقمًا واحدًا لا يقول إن كان الشهر جيّدًا أم مزدحمًا بالإلغاء. */
function incomeReport(month) {
  const inMonth = S.bookings.filter((b) => b.the_date.startsWith(month));
  const live = inMonth.filter((b) => !['cancelled', 'rejected', 'no_show'].includes(b.status));
  const doneL = inMonth.filter((b) => b.status === 'done');
  const lost = inMonth.filter((b) => ['cancelled', 'rejected', 'no_show'].includes(b.status));

  const sum = (a) => a.reduce((n, b) => n + Number(b.price), 0);
  const expected = sum(live), actual = sum(doneL), missed = sum(lost);
  const top = Math.max(expected, missed, 1);

  // إيراد كل خدمة يُجمع من العناصر لا من الحجز، فالحجز الجماعي يوزَّع صحيحًا.
  const per = new Map();
  live.forEach((b) => (b.booking_items || []).forEach((i) => {
    const k = i.service_name || 'أخرى';
    const cur = per.get(k) || { n: 0, v: 0 };
    per.set(k, { n: cur.n + 1, v: cur.v + Number(i.price || 0) });
  }));
  const svcRows = [...per.entries()].sort((a, b) => b[1].v - a[1].v);
  const svcTop = Math.max(...svcRows.map(([, v]) => v.v), 1);

  const bar = (cls, label, val, note) => `
    <div class="bar ${cls}">
      <div class="t"><span>${esc(label)}${note ? ` <span class="muted">${esc(note)}</span>` : ''}</span>
        <b>${money(val)}</b></div>
      <div class="track"><div class="fill" style="width:${Math.round((val / top) * 100)}%"></div></div>
    </div>`;

  return `
    <div class="sec-head"><h2>دخل هذا الشهر</h2><span class="rule"></span>
      <span class="count">${int(inMonth.length)} حجز</span></div>
    <div class="card mb">
      <div class="bars">
        ${bar('', 'المتوقّع', expected, `${live.length} حجز قائم`)}
        ${bar('ok', 'الفعلي المكتمل', actual, `${doneL.length} حجز`)}
        ${missed > 0 ? bar('bad', 'ضاع بالإلغاء', missed, `${lost.length} حجز`) : ''}
      </div>
    </div>

    ${svcRows.length ? `
      <div class="card">
        <p class="label">الدخل حسب الخدمة</p>
        <div class="bars">
          ${svcRows.map(([name, v]) => `
            <div class="bar muted">
              <div class="t"><span>${esc(name)} <span class="muted">×${int(v.n)}</span></span>
                <b>${money(v.v)}</b></div>
              <div class="track"><div class="fill" style="width:${Math.round((v.v / svcTop) * 100)}%"></div></div>
            </div>`).join('')}
        </div>
      </div>` : ''}`;
}

function shareDayPlan(date) {
  const list = S.bookings
    .filter((b) => b.the_date === date && ['confirmed', 'pending', 'done'].includes(b.status))
    .sort((a, b) => a.start_time.localeCompare(b.start_time));
  if (!list.length) return toast('لا مواعيد في هذا اليوم');
  const phone = S.settings?.driver_phone;
  const text = templates.driverDay(list, date);
  if (!phone) {
    navigator.clipboard?.writeText(text);
    return toast('لم يُضبط رقم السائق — نُسخت الخطة', 'ok');
  }
  window.open(waHref(phone, text), '_blank', 'noopener');
}

/* ── Agenda ───────────────────────────────────────────────────────────── */

function renderAgenda() {
  const d = S.agendaDate;
  const list = S.bookings.filter((b) => b.the_date === d && !['cancelled', 'rejected'].includes(b.status))
                         .sort((a, b) => a.start_time.localeCompare(b.start_time));
  const buffer = S.settings?.travel_buffer_min ?? 40;

  const stops = list.map((b, i) => {
    const end = addMinutes(b.start_time, b.duration_min).time;
    const next = list[i + 1];
    let gap = '';
    if (next) {
      const free = addMinutes(next.start_time, 0).absolute - addMinutes(end, 0).absolute;
      gap = free < buffer
        ? `<div class="gap" style="color:var(--danger)">${icon('close', 13)} ${free} دقيقة فقط حتى الموعد التالي — أقل من وقت الانتقال (${buffer})</div>`
        : `<div class="gap">${free} دقيقة حتى الموعد التالي</div>`;
    }
    return `
      <div class="stop">
        ${bookingCard(b, { showDate: false })}
      </div>${gap}`;
  }).join('');

  view.innerHTML = `
    <div class="sec-head" style="margin-top:18px"><h2>الأجندة</h2><span class="rule"></span></div>
    ${monthGrid()}
    <div class="split mb" style="margin-top:14px">
      <div class="field" style="margin:0">
        <label class="label" for="agDate">اليوم</label>
        <input class="input" type="date" id="agDate" value="${d}">
      </div>
      <button class="btn btn-ghost" id="agToday" style="flex:0 0 auto;width:auto">اليوم</button>
    </div>
    <p class="muted mb">${fmtDate(d)}</p>
    ${list.length
      ? `<div class="tl">${stops}</div>
         <button class="btn btn-soft mt" id="agShare">${icon('driver', 18)} إرسال خطة اليوم للسائق</button>`
      : '<div class="empty"><div class="badge lg" data-icon="calendar"></div><p>لا مواعيد في هذا اليوم.</p></div>'}`;

  bindCards();
  bindMonthGrid();
  document.getElementById('agDate').onchange = (e) => {
    S.agendaDate = e.target.value; S.calMonth = e.target.value.slice(0, 7); render();
  };
  document.getElementById('agToday').onclick = () => {
    S.agendaDate = today(); S.calMonth = today().slice(0, 7); render();
  };
  const sh = document.getElementById('agShare');
  if (sh) sh.onclick = () => shareDayPlan(d);
}

/* التقويم الشهري: نقطة لكل حالة تحت رقم اليوم، فتُقرأ حالة الشهر كلّه
   من نظرة واحدة قبل فتح أي يوم. */
function monthGrid() {
  const [y, m] = S.calMonth.split('-').map(Number);
  const first = new Date(y, m - 1, 1);
  const lead = first.getDay();                       // الأحد أوّل الأسبوع
  const days = new Date(y, m, 0).getDate();
  const t = today();

  const byDay = {};
  S.bookings.filter((b) => b.the_date.startsWith(S.calMonth)).forEach((b) => {
    const k = b.the_date;
    (byDay[k] ||= new Set()).add(
      ['cancelled', 'rejected', 'no_show'].includes(b.status) ? 'off' : b.status);
  });

  const cells = [];
  for (let i = 0; i < lead; i += 1) cells.push('<span class="cd blank"></span>');
  for (let dn = 1; dn <= days; dn += 1) {
    const iso = `${S.calMonth}-${String(dn).padStart(2, '0')}`;
    const kinds = [...(byDay[iso] || [])].filter((k) => k !== 'off').slice(0, 3);
    cells.push(`<button class="cd${iso === t ? ' today' : ''}" data-cd="${iso}"
      ${iso === S.agendaDate ? 'aria-pressed="true"' : ''}>
      <span>${int(dn)}</span>
      <span class="dots">${kinds.map((k) => `<i class="d-${esc(k)}"></i>`).join('')}</span>
    </button>`);
  }

  const shift = (n) => {
    const d = new Date(y, m - 1 + n, 1);
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
  };
  const MONTHS = ['يناير','فبراير','مارس','أبريل','مايو','يونيو',
                  'يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
  const label = `${MONTHS[m - 1]} ${y}`;

  return `
    <div class="calhead">
      <!-- في RTL يقع «السابق» يمينًا، فيشير سهمُه يمينًا نحو الخارج لا يسارًا. -->
      <button class="iconbtn" data-mv="${shift(-1)}" aria-label="الشهر السابق" data-icon="chevron"></button>
      <b>${esc(label)}</b>
      <button class="iconbtn" data-mv="${shift(1)}" aria-label="الشهر التالي" data-icon="back"></button>
    </div>
    <div class="cal">
      ${WEEKDAYS.map((w) => `<span class="dow">${esc(w.short)}</span>`).join('')}
      ${cells.join('')}
    </div>`;
}
function bindMonthGrid() {
  view.querySelectorAll('[data-mv]').forEach((b) => b.onclick = () => {
    S.calMonth = b.dataset.mv; render(); hydrateIcons(view);
  });
  view.querySelectorAll('[data-cd]').forEach((b) => b.onclick = () => {
    S.agendaDate = b.dataset.cd; render(); hydrateIcons(view);
  });
}

      <label class="label" for="r-label">تسمية <span class="opt">(اختياري)</span></label>

    <div id="r-err"></div>
    <button class="btn btn-primary" id="r-save">حفظ</button>`);

  document.getElementById('r-save').onclick = async () => {
    const from = document.getElementById('r-from').value;
    const to   = document.getElementById('r-to').value;
    if (!from || !to || to <= from) {
      document.getElementById('r-err').innerHTML =
        `<div class="note danger mb">${icon('close', 18)}<span>وقت النهاية يجب أن يكون بعد البداية.</span></div>`;
      return;
    }
    await admin.saveRule({
      ...(rule.id ? { id: rule.id } : {}),
      weekday: Number(document.getElementById('r-day').value),
      start_time: from, end_time: to,
      label: document.getElementById('r-label').value.trim() || null,
      active: true,
    });
    closeSheet(sheet); toast('حُفظت الفترة', 'ok'); reload();
  };
}

function editOverride() {
  showSheet('يوم استثنائي', `
    <div class="field">
      <label class="label" for="o-date">التاريخ</label>
      <input class="input" type="date" id="o-date" min="${today()}" value="${today()}">
    </div>
    <div class="field">
      <label class="label">النوع</label>
      <div class="btn-row">
        <button class="choice" id="o-closed" aria-pressed="true" style="justify-content:center">إجازة</button>
        <button class="choice" id="o-custom" aria-pressed="false" style="justify-content:center">ساعات خاصة</button>
      </div>
    </div>
    <div class="split mb hide" id="o-hours">
      <div class="field" style="margin:0"><label class="label" for="o-from">من</label>
        <input class="input" type="time" id="o-from" value="09:00"></div>
      <div class="field" style="margin:0"><label class="label" for="o-to">إلى</label>
        <input class="input" type="time" id="o-to" value="13:00"></div>
    </div>
    <div class="field">
      <label class="label" for="o-note">ملاحظة <span class="opt">(اختياري)</span></label>
      <input class="input" id="o-note" placeholder="مثال: سفر">
    </div>
    <div id="o-err"></div>
    <button class="btn btn-primary" id="o-save">حفظ</button>`);

  let kind = 'closed';
  const pick = (k) => {
    kind = k;
    document.getElementById('o-closed').setAttribute('aria-pressed', String(k === 'closed'));
    document.getElementById('o-custom').setAttribute('aria-pressed', String(k === 'custom'));
    document.getElementById('o-hours').classList.toggle('hide', k !== 'custom');
  };
  document.getElementById('o-closed').onclick = () => pick('closed');
  document.getElementById('o-custom').onclick = () => pick('custom');

  document.getElementById('o-save').onclick = async () => {
    const row = {
      the_date: document.getElementById('o-date').value,
      kind,
      note: document.getElementById('o-note').value.trim() || null,
      start_time: kind === 'custom' ? document.getElementById('o-from').value : null,
      end_time:   kind === 'custom' ? document.getElementById('o-to').value   : null,
    };
    if (!row.the_date) return;
    if (kind === 'custom' && (!row.start_time || !row.end_time || row.end_time <= row.start_time)) {
      document.getElementById('o-err').innerHTML =
        `<div class="note danger mb">${icon('close', 18)}<span>وقت النهاية يجب أن يكون بعد البداية.</span></div>`;
      return;
    }
    try {
      await admin.saveOverride(row);
      closeSheet(sheet); toast('حُفظ اليوم', 'ok'); reload();
    } catch (err) {
      document.getElementById('o-err').innerHTML =
        `<div class="note danger mb">${icon('close', 18)}<span>${esc(err.message)}</span></div>`;
    }
  };
}

const ICON_CHOICES = ['bride', 'evening', 'lipstick', 'brush', 'mirror', 'sparkle', 'heart', 'user'];

function editService(s) {
  showSheet(s.id ? 'تعديل الخدمة' : 'خدمة جديدة', `
    <div class="field"><label class="label" for="s-name">الاسم</label>
      <input class="input" id="s-name" value="${esc(s.name)}" placeholder="مثال: ميك اب خطوبة"></div>

      <div class="slots" style="grid-template-columns:repeat(4,1fr)">
        ${ICON_CHOICES.map((n) => `
          <button class="slot" data-ico="${n}" aria-pressed="${n === s.icon}" aria-label="${n}"
                  style="display:grid;place-items:center">${icon(n, 21)}</button>`).join('')}
      </div>
    </div>
    <div class="split mb">
      <div class="field" style="margin:0"><label class="label" for="s-price">السعر (ر.س)</label>
        <input class="input ltr" id="s-price" type="number" min="0" inputmode="numeric" value="${Number(s.price)}"></div>
      <div class="field" style="margin:0"><label class="label" for="s-dur">المدة (دقيقة)</label>
        <input class="input ltr" id="s-dur" type="number" min="15" max="600" step="5" inputmode="numeric" value="${Number(s.duration_min)}"></div>
      <div class="field" style="margin:0"><label class="label" for="s-dep">العربون (ر.س)</label>
        <input class="input ltr" id="s-dep" type="number" min="0" inputmode="numeric" value="${Number(s.deposit_amount || 0)}">
        <p class="hint">المبلغ المطلوب لتثبيت الموعد لكل شخص. صفر = بلا عربون.</p></div>
    </div>
    <div class="field"><label class="label" for="s-desc">وصف مختصر <span class="opt">(اختياري)</span></label>
      <input class="input" id="s-desc" value="${esc(s.description || '')}"></div>
    <label class="choice mb"><input type="checkbox" id="s-public" ${s.bookable_by_client ? 'checked' : ''}
        style="width:20px;height:20px;accent-color:var(--rose-deep)">
      <span class="grow"><span class="t">تظهر لصفحة العميلات</span>
        <span class="s">أوقفيها لخدمة تحجزينها أنتِ فقط</span></span></label>
    <label class="choice mb"><input type="checkbox" id="s-group" ${s.group_discount ? 'checked' : ''}
        style="width:20px;height:20px;accent-color:var(--rose-deep)">
      <span class="grow"><span class="t">يشملها خصم المجموعة</span>
        <span class="s">يُطبَّق تلقائيًا من شخصين فأكثر، بالمبلغ المحدَّد في الإعدادات</span></span></label>
    <div id="s-err"></div>
    <div class="btn-row">
      ${s.id ? '<button class="btn btn-danger" id="s-del">إخفاء</button>' : ''}
      <button class="btn btn-primary" id="s-save">حفظ</button>
    </div>`);

  let ico = s.icon;
  view.ownerDocument.querySelectorAll('[data-ico]').forEach((b) => b.onclick = () => {
    ico = b.dataset.ico;
    document.querySelectorAll('[data-ico]').forEach((x) =>
      x.setAttribute('aria-pressed', String(x.dataset.ico === ico)));
  });

  document.getElementById('s-save').onclick = async () => {
    const name = document.getElementById('s-name').value.trim();
    const price = Number(document.getElementById('s-price').value);
    const dur = Number(document.getElementById('s-dur').value);
    const dep = Number(document.getElementById('s-dep').value);
    const err = document.getElementById('s-err');
    if (name.length < 2) { err.innerHTML = note('اكتبي اسم الخدمة.'); return; }
    if (!(dur >= 15 && dur <= 600)) { err.innerHTML = note('المدة بين 15 و600 دقيقة.'); return; }
    if (!(price >= 0)) { err.innerHTML = note('السعر غير صحيح.'); return; }
    if (price === 0 && !confirm('السعر صفر. هل تريدين المتابعة؟')) return;
    // القاعدة ترفض عربونًا يتجاوز السعر، فيُقال هنا بلغة مفهومة بدل رسالة خطأ من الخادم.
    if (!(dep >= 0) || dep > price) {
      err.innerHTML = note('العربون بين صفر وسعر الخدمة.'); return;
    }
    await admin.saveService({
      ...(s.id ? { id: s.id } : {}), name, icon: ico, price, duration_min: dur,
      deposit_amount: dep,
      description: document.getElementById('s-desc').value.trim() || null,
      bookable_by_client: document.getElementById('s-public').checked,
      group_discount: document.getElementById('s-group').checked,
      active: true, sort: s.sort ?? 0,
    });
    closeSheet(sheet); toast('حُفظت الخدمة', 'ok'); reload();
  };
  const del = document.getElementById('s-del');
  if (del) del.onclick = async () => {
    await admin.deleteService(s.id);
    closeSheet(sheet); toast('أُخفيت الخدمة — الحجوزات السابقة لم تتأثر', 'ok'); reload();
  };
}

  document.getElementById('saveSettings').onclick = async () => {
    const err = document.getElementById('set-err');
    const wa  = document.getElementById('set-wa').value.trim();
    const drv = document.getElementById('set-drv').value.trim();
    if (wa && !normalisePhone(wa))  { err.innerHTML = note('رقم واتساب غير صحيح.'); return; }
    if (drv && !normalisePhone(drv)) { err.innerHTML = note('رقم السائق غير صحيح.'); return; }

    const grp = Number(document.getElementById('set-grp').value);
    if (!(grp >= 0)) { err.innerHTML = note('مبلغ خصم المجموعة غير صحيح.'); return; }
    // الآيبان يُخزَّن بلا مسافات: SA ثم 22 رقمًا. القاعدة ترفض غير ذلك،
    // فالأفضل أن تعرف صاحبته السبب هنا لا في رسالة خطأ من الخادم.
    const ibanRaw = document.getElementById('set-iban').value.replace(/\s+/g, '').toUpperCase();

    const ig = document.getElementById('set-ig').value.trim();

    for (const [v, name] of [[ig, 'إنستقرام'], [tt, 'تيك توك']]) {
      if (v && !/^https:\/\/\S+$/i.test(v)) {
        err.innerHTML = note(`رابط ${name} يجب أن يبدأ بـ https://`); return;
      }

    err.innerHTML = '';
    try {
      await admin.saveSettings({
        accepting_bookings: document.getElementById('set-open').checked,
        business_name: document.getElementById('set-name').value.trim(),
        tagline: document.getElementById('set-tag').value.trim() || null,

        whatsapp_phone: wa ? normalisePhone(wa) : null,
        driver_phone: drv ? normalisePhone(drv) : null,
        group_discount_amount: grp,
        receipt_ocr_required: document.getElementById('set-ocr').checked,
        bank_name: document.getElementById('set-bank').value.trim() || null,
        iban: ibanRaw || null,
        beneficiary_name: document.getElementById('set-benef').value.trim() || null,
        instagram_url: ig || null,
        tiktok_url: tt || null,
      });
      toast('حُفظت الإعدادات', 'ok'); reload();
    } catch (e) { err.innerHTML = note(e.message); }
  };

  /* ── حذف الحجوزات ────────────────────────────────────────────────
     خطوتان دائمًا: تُعرض العدّة قبل الحذف، ثم يُطلب تأكيد. و«كل الحجوزات»
     يلزمها كتابة كلمة — لأن ضغطة واحدة لا يصحّ أن تمسح عمل موسم. */
  {
    const g = (id) => document.getElementById(id);
    const scope = g('pg-scope'), dates = g('pg-dates'), cnt = g('pg-count');
    const conf = g('pg-confirm'), word = g('pg-word'), go = g('pg-go'), perr = g('pg-err');
    let last = { from: null, to: null, count: 0 };

    const shift = (n) => addDays(today(), n);
    function bounds() {
      switch (scope.value) {
        case 'week':   return [today(), shift(7)];
        case 'month':  return [today(), shift(30)];
        case 'future': return [today(), null];
        case 'past':   return [null, shift(-1)];
        case 'range':  return [g('pg-from').value || null, g('pg-to').value || null];
        default:       return [null, null];
      }
    }

    let seq = 0;
    async function preview() {
      const mine = ++seq;
      const [from, to] = bounds();
      dates.hidden = scope.value !== 'range';
      conf.hidden = scope.value !== 'all';
      perr.innerHTML = '';
      if (scope.value === 'range' && (!from || !to)) {
        cnt.textContent = 'اختاري تاريخي البداية والنهاية.';
        go.disabled = true; return;
      }
      cnt.textContent = 'جارٍ العدّ…'; go.disabled = true;
      try {
        const r = await admin.purgePreview(from, to);
        if (mine !== seq) return;                      // ردّ قديم وصل متأخّرًا
        last = { from, to, count: r.count };
        cnt.textContent = r.count === 0
          ? 'لا حجوزات في هذا النطاق.'
          : `سيُحذف ${r.count === 1 ? 'حجز واحد' : r.count === 2 ? 'حجزان'
                : r.count <= 10 ? `${r.count} حجوزات` : `${r.count} حجزًا`}` +
            (r.receipts.length ? ` ومعها ${r.receipts.length} صورة إيصال.` : '.');
        gate();
      } catch (e) {
        if (mine !== seq) return;
        cnt.textContent = '—'; perr.innerHTML = note(e.message); go.disabled = true;
      }
    }
    function gate() {
      go.disabled = last.count === 0
        || (scope.value === 'all' && word.value.trim() !== 'حذف');
    }

    scope.onchange = preview;
    g('pg-from').onchange = preview;
    g('pg-to').onchange = preview;
    word.oninput = gate;
    preview();

    go.onclick = async () => {
      if (go.disabled) return;
      const label = scope.options[scope.selectedIndex].text.split('—')[0].trim();
      if (!confirm(`سيُحذف ${last.count} حجزًا (${label}) نهائيًا بلا تراجع.\nمتأكدة؟`)) return;
      go.disabled = true; perr.innerHTML = '';
      const was = go.innerHTML; go.textContent = 'جارٍ الحذف…';
      try {
        const r = await admin.purgeBookings(last.from, last.to);
        toast(`حُذف ${r.count} حجزًا`, 'ok');
        word.value = ''; reload();
      } catch (e) {
        perr.innerHTML = note(e.message); go.innerHTML = was; gate();
      }
    };
  }

  document.getElementById('btnBackup').onclick = async () => {
    const data = await admin.exportAll();
    download(`نسخة-احتياطية-${today()}.json`, JSON.stringify(data, null, 2));
    toast('نُزّلت النسخة', 'ok');
  };

  document.getElementById('btnCsv').onclick = () => {
    const csv = toCSV(S.bookings, [
      { label: 'رقم الطلب', get: (b) => b.ref },
      { label: 'الاسم',      get: (b) => b.client_name },
      { label: 'الجوال',     get: (b) => prettyPhone(b.client_phone) },
      { label: 'التاريخ',    get: (b) => b.the_date },
      { label: 'الوقت',      get: (b) => fmtTime(b.start_time) },
      { label: 'المدة',      get: (b) => b.duration_min },
      { label: 'الخدمات',    get: (b) => (b.booking_items || []).map((i) => i.service_name).join(' + ') },
      { label: 'الموقع',     get: (b) => b.loc_text || '' },
      { label: 'الإجمالي',   get: (b) => b.price },
      { label: 'المدفوع',    get: (b) => b.deposit },
      { label: 'المتبقي',    get: (b) => Number(b.price) - Number(b.deposit) },
      { label: 'الحالة',     get: (b) => statusLabel(b.status) },
    ]);
    download(`حجوزات-${today()}.csv`, csv, 'text/csv');
    toast('نُزّل الملف', 'ok');
  };
}

    // keep their own real prices and the two never contradict each other.

function renderActions(b) {
  const host = document.getElementById('d-actions');
  const act = (label, cls, fn, ico) => {
    const el = document.createElement('button');
    el.className = `btn ${cls}`;
    el.innerHTML = `${ico ? icon(ico, 18) : ''} ${label}`;
    el.onclick = fn;
    return el;
  };
  const set = async (status, msg) => {
    await admin.setStatus(b.id, status);
    closeSheet(sheet); toast(msg, 'ok'); reload();
  };

  host.innerHTML = '';
  const row = document.createElement('div');
  row.className = 'btn-row mb';

  if (b.status === 'pending') {
    row.append(
      act('تأكيد الحجز', 'btn-primary', () => set('confirmed', 'تم تأكيد الحجز'), 'check'),
      act('اعتذار', 'btn-danger', () => confirmThen('الاعتذار عن هذا الطلب؟', () => set('rejected', 'تم الاعتذار'))),
    );
  } else if (b.status === 'confirmed') {
    const finish = async () => {
      const rest = Number(b.price) - Number(b.deposit);
      if (rest > 0) {
        // الحجز يُقفل بمتبقٍّ معلّق لو لم يُسأل، فيبقى في المستحقات بلا سبب.
        const paid = confirm(`تبقّى ${money(rest)} ر.س على ${b.client_name}.\n`
          + 'هل استلمتِ المبلغ كاملًا؟\n\nنعم = يُقفل مسدّدًا · إلغاء = يبقى في المستحقات');
        if (paid) await admin.update(b.id, { deposit: Number(b.price) });
      }
      await set('done', rest > 0 ? 'تم وضعه مكتملًا' : 'تم وضعه مكتملًا');
    };
    row.append(
      act('تم الإنجاز', 'btn-primary', finish, 'check'),
      act('لم تحضر', 'btn-ghost', () => confirmThen('تسجيل عدم الحضور؟', () => set('no_show', 'سُجّل عدم الحضور'))),
    );
  } else {
    row.append(act('إعادة للمؤكدة', 'btn-ghost', () => set('confirmed', 'أُعيد الحجز'), 'back'));
  }
  host.append(row);

  if (['pending', 'confirmed'].includes(b.status)) {
    const cancel = act('إلغاء الحجز', 'btn-danger',
      () => confirmThen(`إلغاء حجز ${b.client_name}؟`, () => set('cancelled', 'أُلغي الحجز')));
    host.append(cancel);
  }
  hydrateIcons(host);
}

/* تعديل الحجز: كل ما يمكن أن يتغيّر بعد الاتفاق — الموعد أولها. إعادة
   الجدولة كانت مستحيلة من اللوحة، فكان لا بدّ من فتح قاعدة البيانات لتغيير
   ساعة. الخدمات تُستبدل دفعة واحدة فيُعاد حساب السعر والمدة من القاعدة. */
function openEdit(b) {
  const svcs = S.services.filter((s) => s.active);
  const items = b.booking_items || [];
  const counts = {};
  items.forEach((i) => { if (i.service_id) counts[i.service_id] = (counts[i.service_id] || 0) + 1; });
  /* عناصر تشير إلى خدمة حُذفت أو أُخفيت لا تظهر في العدّادات. لو استُبدلت
     القائمة عندئذٍ ضاعت خدمات الحجز، فتُترك كما هي ما لم تُلمس العدّادات. */
  const mapped = Object.values(counts).reduce((n, v) => n + v, 0);
  const orphan = items.length - mapped;
  const origKey = Object.entries(counts).sort().map(([k, v]) => `${k}:${v}`).join(',');

  showSheet(`تعديل — ${b.client_name}`, `
    <div class="field"><label class="label" for="e-name">اسم العميلة</label>
      <input class="input" id="e-name" value="${esc(b.client_name)}"></div>
    <div class="field"><label class="label" for="e-phone">رقم الجوال</label>
      <input class="input ltr" id="e-phone" type="tel" inputmode="numeric"
             value="${esc(prettyPhone(b.client_phone).replace(/\s/g, ''))}"></div>

    <div class="split mb">
      <div class="field" style="margin:0"><label class="label" for="e-date">التاريخ</label>
        <input class="input ltr" type="date" id="e-date" value="${esc(b.the_date)}"></div>
      <div class="field" style="margin:0"><label class="label" for="e-time">الوقت</label>
        <input class="input ltr" type="time" id="e-time" value="${esc(String(b.start_time).slice(0, 5))}"></div>
    </div>

    <div class="card mb">
      <p class="label">الخدمات والأشخاص</p>
      <div class="list">
        ${svcs.map((sv) => `
          <div class="rowline">
            <span class="grow"><span class="t">${esc(sv.name)}</span>
              <span class="s">${money(sv.price)} ر.س · ${int(sv.duration_min)}د</span></span>
            <span class="stepper">
              <button type="button" data-ed="-" data-sid="${esc(sv.id)}" aria-label="إنقاص">−</button>
              <span class="val" data-ev="${esc(sv.id)}">${int(counts[sv.id] || 0)}</span>
              <button type="button" data-ed="+" data-sid="${esc(sv.id)}" aria-label="زيادة">+</button>
            </span>
          </div>`).join('')}
      </div>
      <div class="leader" style="margin-top:8px"><span class="k">الإجمالي بعد التعديل</span>
        <span class="d"></span><span class="v" id="e-sum">—</span></div>
      <p class="hint" id="e-dur">—</p>
      ${orphan > 0 ? `<div class="note warn" style="margin-top:10px">${icon('clock', 18)}
        <span>${int(orphan)} من خدمات هذا الحجز لم تعد في قائمة الخدمات النشطة، فلا تظهر أعلاه.
        لن تُمسّ ما لم تغيّري العدّادات.</span></div>` : ''}
    </div>

    <div class="field"><label class="label" for="e-loc">الحي والمدينة</label>
      <input class="input" id="e-loc" value="${esc(b.loc_text || '')}"></div>
    <div class="field"><label class="label" for="e-map">رابط خرائط قوقل <span class="opt">(اختياري)</span></label>
      <input class="input ltr" id="e-map" dir="ltr" placeholder="https://maps.app.goo.gl/..."
             value="${esc(b.loc_map || '')}"></div>
    <div class="field"><label class="label" for="e-notes">ملاحظات العميلة</label>
      <textarea class="input" id="e-notes" rows="2">${esc(b.client_notes || '')}</textarea></div>

    <div id="e-err"></div>
    <div class="btn-row">
      <button class="btn btn-ghost" id="e-back">رجوع</button>
      <button class="btn btn-primary" id="e-save">حفظ التعديل</button>
    </div>`);

  const g = (id) => document.getElementById(id);
  const readCounts = () => Object.fromEntries(svcs.map((sv) =>
    [sv.id, Number(document.querySelector(`[data-ev="${CSS.escape(sv.id)}"]`).textContent) || 0]));
  function recompute() {
    const c = readCounts();
    let total = 0, dur = 0, n = 0;
    svcs.forEach((sv) => { total += sv.price * c[sv.id]; dur += sv.duration_min * c[sv.id]; n += c[sv.id]; });
    g('e-sum').textContent = n ? `${money(total)} ر.س` : '—';
    g('e-dur').textContent = n ? `${int(n)} خدمة · ${fmtDuration(Math.max(dur, 15))}` : 'اختاري خدمة واحدة على الأقل.';
  }
  document.querySelectorAll('[data-ed]').forEach((btn) => btn.onclick = () => {
    const cell = document.querySelector(`[data-ev="${CSS.escape(btn.dataset.sid)}"]`);
    const next = Math.max(0, Math.min(12, Number(cell.textContent) + (btn.dataset.ed === '+' ? 1 : -1)));
    cell.textContent = String(next); recompute();
  });
  recompute();
  g('e-back').onclick = () => openBooking(b.id);

  g('e-save').onclick = async () => {
    const err = g('e-err');
    const name = g('e-name').value.trim();
    const phone = normalisePhone(g('e-phone').value);
    const date = g('e-date').value, time = g('e-time').value;
    const c = readCounts();
    const chosen = svcs.flatMap((sv) => Array.from({ length: c[sv.id] }, () => sv));
    const map = g('e-map').value.trim();
    if (name.length < 2) { err.innerHTML = note('اكتبي اسم العميلة.'); return; }
    if (!phone) { err.innerHTML = note('رقم الجوال غير صحيح.'); return; }
    if (!date || !time) { err.innerHTML = note('اختاري التاريخ والوقت.'); return; }
    if (!chosen.length && !orphan) { err.innerHTML = note('اختاري خدمة واحدة على الأقل.'); return; }
    if (map && !/^https:\/\/\S+$/i.test(map)) { err.innerHTML = note('رابط الخريطة يجب أن يبدأ بـ https://'); return; }
    err.innerHTML = '';
    const btn = g('e-save'); btn.disabled = true; btn.textContent = 'جارٍ الحفظ…';
    const nowKey = Object.entries(c).filter(([, v]) => v > 0).sort().map(([k, v]) => `${k}:${v}`).join(',');
    try {
      // لا تُستبدل العناصر إلا إذا تغيّرت فعلًا: تصحيح رقم جوال لا يصحّ أن
      // يعيد بناء خدمات الحجز.
      if (nowKey !== origKey) await admin.replaceItems(b.id, chosen.map((sv) => ({
        service_id: sv.id, service_name: sv.name, service_icon: sv.icon,
        price: sv.price, duration_min: sv.duration_min,
        group_discount: sv.group_discount, deposit_amount: sv.deposit_amount || 0,
      })));
      await admin.update(b.id, {
        client_name: name, client_phone: phone, the_date: date,
        start_time: time.length === 5 ? `${time}:00` : time,
        loc_text: g('e-loc').value.trim() || null,
        loc_map: map || null,
        client_notes: g('e-notes').value.trim() || null,
      });
      await admin.log(b.id, 'edited');
      closeSheet(sheet); toast('حُفظ التعديل', 'ok'); reload();
    } catch (e) {
      btn.disabled = false; btn.textContent = 'حفظ التعديل'; err.innerHTML = note(e.message);
    }
  };
}

function confirmThen(question, fn) {
  const content = document.getElementById('sheetContent');
  const prev = content.innerHTML;
  content.innerHTML = `
    <div class="arch mb">
      <div class="badge lg on-surface" data-icon="close" data-icon-size="24" style="margin:0 auto 10px"></div>
      <h2>${esc(question)}</h2>
      <p class="muted" style="margin-top:6px">يمكن التراجع لاحقًا من نفس الشاشة.</p>
    </div>
    <div class="btn-row">
      <button class="btn btn-ghost" id="c-no">تراجع</button>
      <button class="btn btn-danger" id="c-yes">نعم، متابعة</button>
    </div>`;
  hydrateIcons(content);
  document.getElementById('c-no').onclick = () => { content.innerHTML = prev; hydrateIcons(content); };
  document.getElementById('c-yes').onclick = fn;
}

/* ── Manual booking (walk-in / phone) ─────────────────────────────────── */

function openNewBooking() {
  const svcs = S.services.filter((s) => s.active);
  if (!svcs.length) return toast('أضيفي خدمة أولًا');

  showSheet('حجز يدوي', `
    <div class="field"><label class="label" for="n-name">اسم العميلة</label>
      <input class="input" id="n-name" placeholder="الاسم الكامل"></div>
    <div class="field"><label class="label" for="n-phone">رقم الجوال</label>
      <input class="input ltr" id="n-phone" type="tel" inputmode="numeric" placeholder="05xxxxxxxx"></div>
    <div class="card mb">
      <p class="label">الخدمات والأشخاص</p>
      <div class="list">
        ${svcs.map((sv) => `
          <div class="rowline">
            <span class="grow"><span class="t">${esc(sv.name)}</span>
              <span class="s">${money(sv.price)} ر.س · ${int(sv.duration_min)}د</span></span>
            <span class="stepper">
              <button type="button" data-nd="-" data-sid="${esc(sv.id)}" aria-label="إنقاص">−</button>
              <span class="val" data-nv="${esc(sv.id)}">0</span>
              <button type="button" data-nd="+" data-sid="${esc(sv.id)}" aria-label="زيادة">+</button>
            </span>
          </div>`).join('')}
      </div>
      <div class="leader" style="margin-top:8px"><span class="k">الإجمالي</span>
        <span class="d"></span><span class="v" id="n-sum">—</span></div>
      <p class="hint" id="n-dur">اختاري خدمة واحدة على الأقل.</p>
    </div>
    <div class="split mb">
      <div class="field" style="margin:0"><label class="label" for="n-date">التاريخ</label>
        <input class="input" type="date" id="n-date" value="${today()}"></div>
      <div class="field" style="margin:0"><label class="label" for="n-time">الوقت</label>
        <input class="input" type="time" id="n-time" value="16:00"></div>
    </div>
    <div class="field"><label class="label" for="n-loc">الحي والمدينة <span class="opt">(اختياري)</span></label>
      <input class="input" id="n-loc"></div>
    <div class="field"><label class="label" for="n-map">رابط خرائط قوقل <span class="opt">(اختياري)</span></label>
      <input class="input ltr" id="n-map" dir="ltr" placeholder="https://maps.app.goo.gl/...">
      <p class="hint">بدونه لا يمكن إرسال الموقع للسائق.</p></div>
    <div class="note mb">${icon('clock', 18)}
      <span>الحجز اليدوي يُحفظ مؤكّدًا مباشرة ولا يمرّ بفحص الأوقات المتاحة — راجعي الأجندة بعده.</span></div>
    <div id="n-err"></div>
    <button class="btn btn-primary" id="n-save">حفظ الحجز</button>`);

  const gn = (id) => document.getElementById(id);
  const nCounts = () => Object.fromEntries(svcs.map((sv) =>
    [sv.id, Number(document.querySelector(`[data-nv="${CSS.escape(sv.id)}"]`).textContent) || 0]));
  function nRecompute() {
    const c = nCounts();
    let total = 0, dur = 0, n = 0;
    svcs.forEach((sv) => { total += sv.price * c[sv.id]; dur += sv.duration_min * c[sv.id]; n += c[sv.id]; });
    gn('n-sum').textContent = n ? `${money(total)} ر.س` : '—';
    const t = gn('n-time').value;
    const ends = (n && t) ? ` · ينتهي ${fmtTime(addMinutes(t, dur).time)}` : '';
    gn('n-dur').textContent = n
      ? `${int(n)} شخص · ${fmtDuration(Math.max(dur, 15))}${ends}`
      : 'اختاري خدمة واحدة على الأقل.';
  }
  document.querySelectorAll('[data-nd]').forEach((btn) => btn.onclick = () => {
    const cell = document.querySelector(`[data-nv="${CSS.escape(btn.dataset.sid)}"]`);
    const next = Math.max(0, Math.min(12, Number(cell.textContent) + (btn.dataset.nd === '+' ? 1 : -1)));
    cell.textContent = String(next); nRecompute();
  });
  gn('n-time').onchange = nRecompute;
  nRecompute();

  gn('n-save').onclick = async () => {
    const err = gn('n-err');
    const name = gn('n-name').value.trim();
    const phone = normalisePhone(gn('n-phone').value);
    const date = gn('n-date').value;
    const time = gn('n-time').value;
    const c = nCounts();
    const chosen = svcs.flatMap((sv) => Array.from({ length: c[sv.id] }, () => sv));
    const map = gn('n-map').value.trim();
    if (name.length < 2) { err.innerHTML = note('اكتبي اسم العميلة.'); return; }
    if (!phone) { err.innerHTML = note('رقم الجوال غير صحيح.'); return; }
    if (!date || !time) { err.innerHTML = note('اختاري التاريخ والوقت.'); return; }
    if (!chosen.length) { err.innerHTML = note('اختاري خدمة واحدة على الأقل.'); return; }
    if (map && !/^https:\/\/\S+$/i.test(map)) { err.innerHTML = note('رابط الخريطة يجب أن يبدأ بـ https://'); return; }
    err.innerHTML = '';
    const btn = gn('n-save'); btn.disabled = true; btn.textContent = 'جارٍ الحفظ…';
    try {
      const dur = chosen.reduce((n2, sv) => n2 + sv.duration_min, 0);
      await admin.createBooking({
        client_name: name, client_phone: phone, the_date: date, start_time: time,
        duration_min: Math.max(dur, 15), status: 'confirmed',
        loc_text: gn('n-loc').value.trim() || null,
        loc_map: map || null,
        confirmed_at: new Date().toISOString(),
      }, chosen.map((sv) => ({
        service_id: sv.id, service_name: sv.name, service_icon: sv.icon,
        price: sv.price, duration_min: sv.duration_min,
        group_discount: sv.group_discount, deposit_amount: sv.deposit_amount || 0,
      })));
      closeSheet(sheet); toast('حُفظ الحجز', 'ok'); reload();
    } catch (e) {
      btn.disabled = false; btn.textContent = 'حفظ الحجز'; err.innerHTML = note(e.message);
    }
  };
}
</script>
